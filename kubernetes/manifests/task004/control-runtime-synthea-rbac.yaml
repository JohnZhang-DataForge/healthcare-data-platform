apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task004-control-runtime-synthea
  namespace: dw-synthea
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - dw-synthea-s3-secret
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task004-control-runtime-synthea
  namespace: dw-synthea
subjects:
  - kind: ServiceAccount
    name: task004-control-runtime
    namespace: dw-spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task004-control-runtime-synthea
