[build-system]
requires = ["setuptools>=75,<83", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-data-engine"
version = "0.1.1"
description = "Pure, platform-neutral healthcare FHIR R4 canonical transformation engine"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
spark = [
    "pyspark==3.5.7; python_version < '3.13'",
    "pyspark==4.1.1; python_version >= '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["healthcare_data_engine*"]
namespaces = true
