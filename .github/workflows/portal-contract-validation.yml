name: Portal Contract Validation

on:
  pull_request:
    paths:
      - 'platform-portal/portal/**'
      - 'documents/systems/platform-portal/portal/**'
      - 'openspec/changes/healthcare-on-demand-live-demo/**'
      - '.github/workflows/portal-contract-validation.yml'
  push:
    branches: [main]
    paths:
      - 'platform-portal/portal/contracts/**'
      - 'platform-portal/portal/fixtures/**'
      - 'platform-portal/portal/tests/**'
      - 'platform-portal/portal/requirements-test.txt'
      - '.github/workflows/portal-contract-validation.yml'

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated schema validation dependency
        run: python -m pip install -r platform-portal/portal/requirements-test.txt
      - name: Validate versioned schemas and fixtures offline
        run: python -m unittest discover -s platform-portal/portal/tests -p 'test_*.py' -v
