name: Shared Engine Wheel Offline Validation
on:
  pull_request:
    paths:
      - 'shared-data-engine/**'
      - '.github/quality/tests/shared-data-engine/parity/**'
      - '.github/workflows/shared-engine-wheel-validation.yml'
      - 'documents/systems/data-platform/shared-engine/CODE.md'
permissions:
  contents: read
jobs:
  shared-engine-contract-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1704067200' # reproducible ZIP timestamps, immutable release clock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version-diff gate needs PR base commit's immutable metadata
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reject changed Shared Engine package source under a reused version
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("HOLD_SHARED_RELEASE_BASE_SHA_UNPINNED")
          before = tomllib.loads(subprocess.check_output(
              ["git", "show", f"{base}:shared-data-engine/pyproject.toml"],
              text=True))["project"]["version"]
          after = tomllib.loads(Path(
              "shared-data-engine/pyproject.toml").read_text())["project"]["version"]
          declared = Path(
              "shared-data-engine/src/healthcare_data_engine/__init__.py").read_text()
          if declared.count(f'__version__ = "{after}"') != 1:
              raise SystemExit("HOLD_SHARED_RELEASE_SOURCE_METADATA_MISMATCH")
          if not all(re.fullmatch(r"\d+\.\d+\.\d+", v) for v in (before, after)):
              raise SystemExit("HOLD_SHARED_RELEASE_VERSION_NOT_NUMERIC")
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD", "--",
               "shared-data-engine/src/"], text=True).splitlines()
          if paths and not (tuple(map(int, after.split("."))) >
                            tuple(map(int, before.split(".")))):
              raise SystemExit("HOLD_SHARED_RELEASE_SOURCE_CHANGED_WITHOUT_VERSION_BUMP")
          print("SHARED_ENGINE_RELEASE_VERSION_PROVENANCE_PASS",
                "base=" + before, "head=" + after, "source_files_changed=" + str(len(paths)))
          PY
      - name: Create pinned wheelhouse then install test environment offline
        run: |
          set -euo pipefail
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          python -m venv "$RUNNER_TEMP/shared-env"
          "$RUNNER_TEMP/shared-env/bin/pip" install --no-index --find-links="$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          "$RUNNER_TEMP/shared-env/bin/python" -c 'import sys,pyspark,setuptools; print(sys.version); print("pyspark",pyspark.__version__); print("setuptools",setuptools.__version__)'
      - name: Synthetic FHIR R4 unit and PySpark Schema/Contract tests
        env:
          PYTHONPATH: shared-data-engine/src
          SPARK_LOCAL_HOSTNAME: localhost
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/shared-env/bin/python" -m unittest discover -s shared-data-engine/tests -p 'test_*.py' -v
      - name: Local/Shared Person and Visit parity (Python 3.11, synthetic only)
        env:
          PYTHONPATH: shared-data-engine/src
          SPARK_LOCAL_HOSTNAME: localhost
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/shared-env/bin/python" - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              '.github/quality/tests/shared-data-engine/parity', pattern='test_*.py')
          assert suite.countTestCases() >= 9, 'Local/Shared parity tests not discovered'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(), 'Local/Shared parity failed'
          print('LOCAL_SHARED_PARITY_OFFLINE_PASS_PERSON_VISIT_FULL_TRANSFORM')
          PY
      - name: Pure Multi-Entity Registry and adapter tests (Python 3.11)
        env:
          PYTHONPATH: shared-data-engine/src
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/shared-env/bin/python" - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(".github/quality/tests/shared-data-engine/mapping", pattern="test_*.py")
          assert suite.countTestCases() >= 66, "Multi-Entity identity/concept/FK tests missing or not discovered"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(), "Multi-Entity Identity/Concept/FK tests failed"
          PY
      - name: Build sole Shared Wheel with pinned offline build tools
        run: |
          set -euo pipefail
          mkdir -p dist dist-repeat
          "$RUNNER_TEMP/shared-env/bin/python" -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir dist ./shared-data-engine
          "$RUNNER_TEMP/shared-env/bin/python" -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir dist-repeat ./shared-data-engine
          cmp dist/*.whl dist-repeat/*.whl
          sha256sum dist/*.whl | tee dist/SHA256SUMS
          echo "REPRODUCIBLE_WHEEL_PASS"
          echo "### Reproducible Python 3.11 wheel" >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo "Two byte-identical builds verified; this is a candidate, not a Fabric environment release." >> "$GITHUB_STEP_SUMMARY"
      - name: Offline Wheel install and independent import outside repository
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/shared-env/bin/pip" install --no-index --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH= "$RUNNER_TEMP/shared-env/bin/python" -c 'import healthcare_data_engine as h; assert h.__version__ == "0.1.9"; print("WHEEL_IMPORT_PASS",h.__version__,h.__file__)'
          PYTHONPATH= "$RUNNER_TEMP/shared-env/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import healthcare_data_engine as h
          from healthcare_data_engine.mapping.omop.candidate_publication import (
              freeze_candidate_scope, decide_candidate_publication,
              CandidatePublicationPlan, ObservedCandidate,
          )
          assert h.__version__ == metadata.version("healthcare-data-engine") == "0.1.9"
          assert callable(freeze_candidate_scope) and callable(decide_candidate_publication)
          assert CandidatePublicationPlan.__module__ == "healthcare_data_engine.mapping.omop.candidate_publication"
          assert ObservedCandidate.__module__ == "healthcare_data_engine.mapping.omop.candidate_publication"
          assert "site-packages" in h.__file__, h.__file__
          print("G5_P3_019_INSTALLED_API_IMPORT_PASS")
          PY
          # Contrast the NEW source-candidate Wheel with immutable existing GA
          # Native 0.1.7. Do not imply GA 0.1.9 Publish.
          "$RUNNER_TEMP/shared-env/bin/python" - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          roots=root/"azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries"
          old=roots/"healthcare_data_engine-0.1.7-py3-none-any.whl"
          wheels=list((root/"dist").glob("healthcare_data_engine-0.1.9-*.whl"))
          assert len(wheels) == 1, "one expected candidate Wheel"
          candidate=wheels[0]
          assert len(list(roots.glob("*.whl"))) == 1, "GA single-wheel violation"
          with zipfile.ZipFile(old) as prior, zipfile.ZipFile(candidate) as after:
              api="healthcare_data_engine/mapping/omop/local_profile.py"
              assert api not in prior.namelist(), "expected previously published GA is old"
              assert api in after.namelist(), "new P3 planner not packed"
          print("G5_017_GA_VS_019_CANDIDATE_SOURCE_ISOLATED_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: healthcare-data-engine-0.1.9-wheel-sha
          path: |
            dist/*.whl
            dist/SHA256SUMS
          retention-days: 30

  fabric-runtime2-python313-source-probe:
    name: Fabric Runtime 2.0 Python 3.13 source and installed Wheel compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test pure Shared Engine API and synthetic FHIR without Spark
        shell: bash
        env:
          PYTHONPATH: shared-data-engine/src
        run: |
          set -euo pipefail
          python -c 'import healthcare_data_engine as h; print("FABRIC_P3_PY313_PURE_IMPORT_PASS", h.__version__)'
          python -m unittest discover -s shared-data-engine/tests -p 'test_fhir_r4_contract.py' -v
          echo 'FABRIC_P3_PY313_PURE_SYNTHETIC_TESTS=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Pure Multi-Entity Registry tests on Python 3.13
        env:
          PYTHONPATH: shared-data-engine/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(".github/quality/tests/shared-data-engine/mapping", pattern="test_*.py")
          assert suite.countTestCases() >= 66, "Multi-Entity identity/concept/FK tests missing or not discovered"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(), "Multi-Entity Identity/Concept/FK tests failed"
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate pure package Spark DataFrame contract with PySpark 4.1 and Python 3.13
        shell: bash
        env:
          PYTHONPATH: shared-data-engine/src
          SPARK_LOCAL_HOSTNAME: localhost
        run: |
          set -euo pipefail
          python -m pip install 'pyspark==4.1.1'
          python -m unittest discover -s shared-data-engine/tests -p 'test_spark_dataframe.py' -v
          python -m unittest discover -s shared-data-engine/tests -p 'test_omop_candidates.py' -v
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              '.github/quality/tests/shared-data-engine/parity', pattern='test_*.py')
          assert suite.countTestCases() >= 9, 'Local/Shared parity tests not discovered'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(), 'Local/Shared parity failed'
          print('LOCAL_SHARED_PARITY_OFFLINE_PASS_PERSON_VISIT_FULL_TRANSFORM')
          PY
          echo 'FABRIC_P3_PY313_SPARK41_OFFLINE_DATAFRAME_AND_OMOP=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Build and pip-install version 0.1.9 Wheel on Python 3.13
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: |
          set -euo pipefail
          python -m pip install 'setuptools==75.8.2' 'wheel==0.45.1'
          mkdir -p "$RUNNER_TEMP/fabric-p3-py313-wheel"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/fabric-p3-py313-wheel" ./shared-data-engine
          sha256sum "$RUNNER_TEMP"/fabric-p3-py313-wheel/*.whl
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/fabric-p3-py313-wheel/healthcare_data_engine-0.1.9-py3-none-any.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH= python - <<'PY'
          import healthcare_data_engine as h
          from importlib import metadata
          assert h.__version__ == "0.1.9", h.__version__
          assert metadata.version("healthcare-data-engine") == "0.1.9"
          requires_python = metadata.metadata("healthcare-data-engine")["Requires-Python"]
          assert ">=3.10" in requires_python and "<3.14" in requires_python, requires_python
          optional_dependencies = metadata.requires("healthcare-data-engine") or []
          assert any("pyspark==3.5.7" in requirement.replace(" ", "") and "3.13" in requirement for requirement in optional_dependencies), optional_dependencies
          assert any("pyspark==4.1.1" in requirement.replace(" ", "") and "3.13" in requirement for requirement in optional_dependencies), optional_dependencies
          print("FABRIC_P3_PY313_WHEEL_INSTALL_IMPORT=PASS", h.__version__, requires_python)
          print("FABRIC_P3_PY313_OPTIONAL_SPARK_MARKERS=PASS")
          PY
          PYTHONPATH= python - <<'PY'
          from importlib import metadata
          import healthcare_data_engine as engine
          from healthcare_data_engine.mapping.omop.candidate_publication import (
              decide_candidate_publication, FrozenCandidateScope,
          )
          assert metadata.version("healthcare-data-engine") == engine.__version__ == "0.1.9"
          assert callable(decide_candidate_publication)
          assert FrozenCandidateScope.__module__ == (
              "healthcare_data_engine.mapping.omop.candidate_publication")
          print("FABRIC_019_PY313_INSTALLED_P3_API=PASS")
          PY
          echo 'FABRIC_P3_PY313_WHEEL_INSTALL_IMPORT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'FABRIC_P3_PY313_OPTIONAL_SPARK_MARKERS=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Python 3.13 pip installed the 0.1.9 Wheel; no Fabric Environment or Notebook was changed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect packaging metadata separately from source import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path("shared-data-engine/pyproject.toml").read_text())["project"]
          spec = project["requires-python"]
          print("FABRIC_RUNTIME_2_TARGET_PYTHON=3.13")
          print("SOURCE_PACKAGE_VERSION=" + project["version"])
          print("SOURCE_REQUIRES_PYTHON=" + spec)
          if spec == ">=3.10,<3.14" and project["version"] == "0.1.9":
              outcome = "PYTHON313_WHEEL_METADATA_ALLOWED"
          else:
              outcome = "HOLD_RELEASE_METADATA_UNREVIEWED"
          print("FABRIC_P3_PACKAGE_METADATA=" + outcome)
          assert outcome == "PYTHON313_WHEEL_METADATA_ALLOWED"
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Fabric Runtime 2.0 uses Python 3.13.\\n")
              summary.write("Packaging metadata: **" + outcome + "**.\\n")
              summary.write("Source import/test PASS is **not** Wheel install, Publish or Notebook runtime PASS.\\n")
          PY
