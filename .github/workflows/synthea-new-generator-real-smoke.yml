name: Synthea New Generator Real Source Smoke
on:
  pull_request:
    paths:
      - "local-data-platform/apps/synthea/synthea_new_generator/**"
      - "local-data-platform/apps/clinical_producers/**"
      - "local-data-platform/config/synthea-new-generator/**"
      - "local-data-platform/contracts/synthea/new-generator/**"
      - "local-data-platform/tests/synthea_new_generator/**"
      - ".github/workflows/synthea-new-generator-real-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  synthea-source-smoke:
    name: Real Synthea v3.3.0 CSV/FHIR source smoke (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pull existing Synthea image with pinned upstream commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          image="ghcr.io/johnzhang-dataforge/healthcare-data-platform-synthea:latest"
          docker pull "${image}"
          actual="$(docker image inspect "${image}" --format '{{index .Config.Labels "io.healthcare-data-platform.synthea.commit"}}')"
          test "${actual}" = "995cf2fd33e67918d4e33110d9f68ad248002221"
          docker image inspect "${image}" --format 'SMOKE_IMAGE_ID={{.Id}} SOURCE_COMMIT={{index .Config.Labels "io.healthcare-data-platform.synthea.commit"}}'
          echo "PINNED_SYNTHEA_PARENT=PASS"

      - name: Create independent FHIR and CSV source requests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/new-generator-requests" "${RUNNER_TEMP}/new-generator-state"
          sudo chown -R 10001:10001 "${RUNNER_TEMP}/new-generator-state"
          cd local-data-platform
          python3 -m apps.clinical_producers.hospital_profiles \
            --profile config/synthea-new-generator/atlanta-fhir.json \
            --request-id ci-atlanta-fhir-0001 --population 1 \
            --output "${RUNNER_TEMP}/new-generator-requests/atlanta-fhir.json"
          python3 -m apps.clinical_producers.hospital_profiles \
            --profile config/synthea-new-generator/johns-creek-hl7.json \
            --request-id ci-johnscreek-fhir-0001 --population 1 \
            --output "${RUNNER_TEMP}/new-generator-requests/johns-creek-fhir.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from apps.clinical_producers.hospital_profiles import build_request, load_profile
          profile = load_profile(Path("config/synthea-new-generator/atlanta-fhir.json"))
          for mode, formats in (("csv", ["CSV"]), ("combined", ["CSV", "FHIR_R4"])):
              request = build_request(profile, f"ci-atlanta-{mode}-0001", population=1)
              request["output_formats"] = formats
              Path(os.environ["RUNNER_TEMP"], "new-generator-requests",
                   f"atlanta-{mode}.json").write_text(json.dumps(request, sort_keys=True))
          PY

      - name: Generate actual local Synthea CSV/FHIR resources
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/johnzhang-dataforge/healthcare-data-platform-synthea:latest"
          for request in atlanta-fhir johns-creek-fhir atlanta-csv atlanta-combined; do
            echo "#### REAL_SYNTHEA_${request}_BEGIN ####"
            docker run --rm --network none --cpus 2 --memory 5g \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/local-data-platform,target=/workspace,readonly" \
              --mount "type=bind,source=${RUNNER_TEMP}/new-generator-requests,target=/inputs,readonly" \
              --mount "type=bind,source=${RUNNER_TEMP}/new-generator-state,target=/synthea-new-generator-state" \
              --workdir /workspace \
              --entrypoint python3 \
              "${image}" -m apps.synthea.synthea_new_generator.entrypoint \
              --request "/inputs/${request}.json"
            echo "#### REAL_SYNTHEA_${request}_END ####"
          done
          echo "SYNTHEA_REAL_GENERATION=PASS"
          echo "AZURE_BLOB_PUBLICATION=NOT_STARTED"
          echo "OMOP_POSTGRES_MUTATION=NO"
          echo "SHARED_KUBERNETES_MUTATION=NO"

      - name: Verify same source request is reused without regeneration
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/johnzhang-dataforge/healthcare-data-platform-synthea:latest"
          docker run --rm --network none --cpus 2 --memory 5g \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/local-data-platform,target=/workspace,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/new-generator-requests,target=/inputs,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/new-generator-state,target=/synthea-new-generator-state" \
            --workdir /workspace \
            --entrypoint python3 \
            "${image}" -m apps.synthea.synthea_new_generator.entrypoint \
            --request "/inputs/atlanta-fhir.json"
          echo "SAME_REQUEST_REPLAY_READBACK=PASS"

      - name: Verify actual generated FHIR source handoff (read-only, no cloud)
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/johnzhang-dataforge/healthcare-data-platform-synthea:latest"
          for pair in "atlanta-fhir:ci-atlanta-fhir-0001:atlanta-fhir.json" "johns-creek-fhir:ci-johnscreek-fhir-0001:johns-creek-hl7.json"; do
            IFS=: read -r feed request profile <<< "$pair"
            echo "#### FHIR_SOURCE_HANDOFF_${feed}_BEGIN ####"
            docker run --rm --network none --read-only --user 10001:10001 \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/local-data-platform,target=/workspace,readonly" \
              --mount "type=bind,source=${RUNNER_TEMP}/new-generator-state,target=/synthea-new-generator-state,readonly" \
              --workdir /workspace --entrypoint python3 "${image}" \
              -m apps.clinical_producers.source_handoff \
              --state-root /synthea-new-generator-state \
              --profile "config/synthea-new-generator/${profile}" \
              --request-id "${request}"
            echo "#### FHIR_SOURCE_HANDOFF_${feed}_PASS ####"
          done
          echo "AZURE_BLOB_PUBLICATION=NOT_STARTED"
          echo "OIE_HL7_TRANSFORMATION=NOT_STARTED"

      - name: Read-only audit of frozen real Synthea Johns Creek ADT V2 mapping profile
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/johnzhang-dataforge/healthcare-data-platform-synthea:latest"
          # Only aggregate counts + code-only HOLD reasons, never FHIR source facts or PHI.
          docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/local-data-platform,target=/workspace,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/new-generator-state,target=/synthea-new-generator-state,readonly" \
            --workdir /workspace --entrypoint python3 "${image}" \
            -m apps.clinical_producers.oie_hl7_publisher_v2 \
            --state-root /synthea-new-generator-state \
            --profile config/synthea-new-generator/johns-creek-hl7.json \
            --request-id ci-johnscreek-fhir-0001
          echo "OIE_V2_REAL_SOURCE_AUDIT=AGGREGATE_ONLY_NOT_LIVE_OIE"
          echo "OIE_V2_CHANNEL_DEPLOYMENT=NOT_STARTED"
          echo "RAW_HL7_AZURE_UPLOAD=NOT_STARTED"

      - name: Extract verified real Johns Creek FHIR event envelopes for OIE Channel acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/oie-real-johns-creek"
          sudo chown 10001:10001 "$RUNNER_TEMP/oie-real-johns-creek"
          program="$(cat <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from apps.clinical_producers.source_handoff import verify_handoff
          from apps.clinical_producers.oie.fhir_events import events_from_bundle
          root=Path("/synthea-new-generator-state")
          source=verify_handoff(root,Path("config/synthea-new-generator/johns-creek-hl7.json"),
                                "ci-johnscreek-fhir-0001")
          assert source["status"]=="SOURCE_HANDOFF_VERIFIED"
          out=Path("/oie-verified")
          out.mkdir(exist_ok=True)
          envelopes=[]
          for f in source["files"]:
              path=root/source["request_relative_path"]/"payload"/f["path"]
              raw=path.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==f["sha256"]
              assert len(raw)==f["size_bytes"]
              envelopes += events_from_bundle(json.loads(raw),"ci-johnscreek-fhir-0001")
          assert len(envelopes)==source["metrics"]["fhir_encounters"] and envelopes
          payload="".join(json.dumps(e,sort_keys=True,separators=(",",":"))+"\n"
                          for e in envelopes)
          (out/"encounter-events.ndjson").write_text(payload,encoding="utf-8")
          (out/"source-handoff.json").write_text(json.dumps(source,sort_keys=True),encoding="utf-8")
          (out/"events-sha256.txt").write_text(hashlib.sha256(payload.encode()).hexdigest()+"\n")
          print("REAL_JOHNS_CREEK_SOURCE_VERIFIED=PASS")
          print("REAL_JOHNS_CREEK_ENCOUNTER_EVENTS="+str(len(envelopes)))
          print("REAL_OIE_EVENT_ARTIFACT_SHA256="+hashlib.sha256(payload.encode()).hexdigest())
          print("OIE_CHANNEL_LIVE_RUNTIME=NOT_TESTED")
          PY
          )"
          image="ghcr.io/johnzhang-dataforge/healthcare-data-platform-synthea:latest"
          docker run --rm --network none --read-only --user 10001:10001 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/local-data-platform,target=/workspace,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/new-generator-state,target=/synthea-new-generator-state,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/oie-real-johns-creek,target=/oie-verified" \
            --workdir /workspace --entrypoint python3 "$image" -c "$program"
          sudo chmod -R a+rX "$RUNNER_TEMP/oie-real-johns-creek"
      - name: Pin Node runtime for actual frozen FHIR to OIE V2 mapper acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse actual frozen Synthea FHIR with production V2 ADT JS mapper (no OIE)
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'JS'
          const fs = require("fs");
          const path = require("path");
          const {fhirToHl7AdtEventsV2} = require("./local-data-platform/apps/clinical_producers/oie/adt_events_v2.js");
          const root = path.join(process.env.RUNNER_TEMP, "oie-real-johns-creek");
          const handoff = JSON.parse(fs.readFileSync(path.join(root, "source-handoff.json"), "utf8"));
          const events = fs.readFileSync(path.join(root, "encounter-events.ndjson"), "utf8").trim().split("\n");
          const counts = {encounters: 0, A01: 0, A03: 0, skipped: 0};
          for (const line of events) {
            const source = JSON.parse(line);
            // Same genuine per-Encounter FHIR resources, no mutation or mock fields.
            const result = fhirToHl7AdtEventsV2(source.bundle, {
              hospital_id: handoff.hospital_id, feed_id: handoff.feed_id,
              request_id: handoff.request_id, assigning_authority: "JOHNSCREEKB"
            });
            counts.encounters += 1;
            counts.skipped += result.skipped_non_admissions;
            for (const event of result.messages) {
              if ((event.event_type !== "A01" && event.event_type !== "A03") ||
                  typeof event.hl7 !== "string" || !event.hl7.startsWith("MSH|") ||
                  !event.hl7.endsWith("\r")) {
                throw new Error("REAL_SOURCE_OIE_V2_INVALID_HL7_EVENT");
              }
              counts[event.event_type] += 1;
            }
          }
          if (counts.encounters !== handoff.metrics.fhir_encounters ||
              counts.encounters !== counts.A01 + counts.skipped ||
              counts.A03 > counts.A01 || counts.A01 === 0) {
            throw new Error("REAL_SOURCE_OIE_V2_EVENT_COVERAGE_MISMATCH");
          }
          // Print only aggregate statistics; never Patient, Encounter or raw HL7 bytes.
          console.log("REAL_SYNTHEA_OIE_ADT_V2_NODE_MAPPING=PASS", JSON.stringify(counts));
          console.log("REAL_OIE_CHANNEL_POST=NOT_STARTED AZURE_BLOB_PUT=NOT_STARTED");
          JS

      - name: Upload immutable synthetic FHIR event proof (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: oie-real-johns-creek-fhir-events-${{ github.run_id }}
          path: ${{ runner.temp }}/oie-real-johns-creek/
          retention-days: 3
          if-no-files-found: error
