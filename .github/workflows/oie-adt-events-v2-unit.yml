name: OIE ADT v2 source mapping offline unit

on:
  pull_request:
    paths:
      - "local-data-platform/apps/clinical_producers/oie/adt_events_v2.js"
      - "local-data-platform/apps/clinical_producers/oie/build_adt_events_v2_channel.py"
      - "local-data-platform/apps/clinical_producers/oie/hl7_readback.py"
      - "local-data-platform/apps/clinical_producers/blob_publish_contract.py"
      - ".github/quality/tests/data-platform/clinical-producers/oie/**"
      - ".github/workflows/oie-adt-events-v2-unit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oie-adt-v2:
    name: OIE A01 A03 synthetic source mapping and new Channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test source-backed HL7 v2.5.1 mapping without cloud
        run: node --test .github/quality/tests/data-platform/clinical-producers/oie/test_adt_events_v2.js
      - name: Validate OIE Channel XML build and deployed Channel isolation
        run: python -m unittest discover -s .github/quality/tests/data-platform/clinical-producers/oie -p 'test_adt_events_v2_channel.py' -v
      - name: Independently parse generated HL7 with hl7apy (no live OIE)
        run: |
          python -m pip install hl7apy==1.3.5
          python -m unittest discover -s .github/quality/tests/data-platform/clinical-producers/oie -p 'test_adt_events_v2_independent_hl7.py' -v
      - name: Verify A03 shared Azure Blob plan and immutable Fake Publisher offline
        run: python -m unittest discover -s .github/quality/tests/data-platform/clinical-producers/oie -p 'test_a03_blob_contract.py' -v
      - name: Preserve old A01 mapping against regression (without OIE runtime calls)
        run: node --test local-data-platform/tests/clinical_producers/test_oie_adt_a01.js
