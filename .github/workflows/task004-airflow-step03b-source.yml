name: TASK004 Airflow STEP03B Source Gate

on:
  push:
    branches:
      - 'feature/task004-airflow-step03b-*'
    paths:
      - 'scripts/task004/04a-prepare-synthea-landing-publisher.sh'
      - 'scripts/task004/04c-run-synthea-generate-publish.sh'
      - 'kubernetes/manifests/task004/control-runtime-synthea-rbac.yaml'
      - 'tests/task004/test_synthea_landing_publisher.py'
      - 'tests/task004/test_airflow_step03b_ingestion_interface.py'
      - '.github/workflows/task004-airflow-step03b-source.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate STEP03B source
        run: |
          set -Eeuo pipefail

          bash -n             scripts/task004/04a-prepare-synthea-landing-publisher.sh

          bash -n             scripts/task004/04c-run-synthea-generate-publish.sh

          python3 -m unittest discover             -s tests/task004             -p 'test_synthea_landing_publisher.py'             -v

          python3 -m unittest discover             -s tests/task004             -p 'test_airflow_step03b_ingestion_interface.py'             -v

          test -s             kubernetes/manifests/task004/control-runtime-synthea-rbac.yaml

          echo "TASK004_AIRFLOW_STEP03B_STATIC_GATE=PASS"

      - name: Verify generator determinism
        run: |
          set -Eeuo pipefail

          TMP_ROOT="$RUNNER_TEMP/task004-step03b-reconstruct"

          rm -rf "$TMP_ROOT"

          PROJECT_ROOT="$TMP_ROOT"             bash               scripts/task004/04a-prepare-synthea-landing-publisher.sh

          cmp             scripts/task004/04c-run-synthea-generate-publish.sh             "$TMP_ROOT/scripts/task004/04c-run-synthea-generate-publish.sh"

          cmp             tests/task004/test_synthea_landing_publisher.py             "$TMP_ROOT/tests/task004/test_synthea_landing_publisher.py"

          echo "TASK004_AIRFLOW_STEP03B_GENERATOR_GATE=PASS"
          echo "RESULT=PASS"
