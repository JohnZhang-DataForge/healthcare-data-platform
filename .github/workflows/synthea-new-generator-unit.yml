name: Synthea New Generator Unit
on:
  pull_request:
    paths:
      - "local-data-platform/apps/synthea/synthea_new_generator/**"
      - "local-data-platform/apps/clinical_producers/**"
      - "local-data-platform/config/synthea-new-generator/**"
      - "local-data-platform/tests/synthea_new_generator/**"
      - "local-data-platform/contracts/synthea/new-generator/**"
      - ".github/workflows/synthea-new-generator-unit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline NEW_ONLY request, payload, and replay tests
        run: python3 -m unittest discover -s local-data-platform/tests/synthea_new_generator -p "test_*.py" -v
      - name: Compile generator modules
        run: python3 -m compileall -q local-data-platform/apps/synthea/synthea_new_generator local-data-platform/apps/clinical_producers
