name: Portal A4 - Spark OpenLineage Static Only (GitHub Hosted)
on:
  push:
    branches: [feature/portal-a4-spark-agent-static-20261014]
    paths:
      - platform-portal/openlineage/spark/**
      - .github/workflows/portal-a4-spark-static.yml
  pull_request:
    paths:
      - platform-portal/openlineage/spark/**
      - .github/workflows/portal-a4-spark-static.yml
permissions:
  contents: read
jobs:
  validate-offline-only:
    # NEVER change to dw-runner-set. Must not access home cluster.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only Python dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check -r platform-portal/openlineage/spark/requirements-static.txt
      - name: No Kubernetes or Spark runtime - source, YAML, run isolation tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile platform-portal/openlineage/spark/probe.py platform-portal/openlineage/spark/render.py
          python -m unittest discover -s platform-portal/openlineage/spark/tests -p 'test_*.py' -v
          python platform-portal/openlineage/spark/render.py --run-token gha01 > "$RUNNER_TEMP/portal-a4-gha01.yaml"
          python - "$RUNNER_TEMP/portal-a4-gha01.yaml" <<'PY'
          import pathlib,sys,yaml
          p=pathlib.Path(sys.argv[1])
          cm,pvc,app=list(yaml.safe_load_all(p.read_text()))
          assert [x["kind"] for x in (cm,pvc,app)]==[
              "ConfigMap","PersistentVolumeClaim","SparkApplication"]
          assert all(x["metadata"]["namespace"]=="dw-spark" for x in (cm,pvc,app))
          assert app["metadata"]["name"]=="portal-a4-gha01"
          assert app["spec"]["restartPolicy"]["type"]=="Never"
          assert pvc["metadata"]["name"]=="portal-a4-gha01-output"
          assert pvc["spec"]["accessModes"]==["ReadWriteOnce"]
          assert pvc["spec"]["storageClassName"]=="local-path"
          assert app["spec"]["volumes"][1]["persistentVolumeClaim"]["claimName"]==pvc["metadata"]["name"]
          assert app["spec"]["arguments"][-1]=="file:///opt/spark/portal-a4-output/gha01/summary.parquet"
          print("PORTAL_A4_GITHUB_HOSTED_OFFLINE_YAML_RENDER=PASS")
          print("PORTAL_A4_STATIC_TEST_SUITE=PASS")
          print("PORTAL_A4_REAL_SPARKAPPLICATION=NOT_RUN")
          print("PORTAL_A4_GITHUB_SELF_RUNNER=NOT_USED")
          print("PORTAL_A4_KUBERNETES_S3_OMOP_MUTATION=NO")
          PY
