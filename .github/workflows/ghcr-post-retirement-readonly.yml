name: GHCR post-retirement exact package verification (read only)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/ghcr-post-retirement-readonly.yml]
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify 3 deleted GHCR packages absent, 9 protected packages present
        shell: bash
        env:
          GHCR_AUDIT_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ghcr-post-retirement"
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          from urllib.parse import quote
          from pathlib import Path
          headers={'Authorization':'Bearer '+os.environ['GHCR_AUDIT_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'ghcr-postretirement-readonly'}
          base='https://api.github.com/orgs/JohnZhang-DataForge/packages/container/'
          active=['healthcare-data-platform-synthea','healthcare-data-platform-task004-runtime','healthcare-data-platform-task004-cdm-runtime','healthcare-landing-discovery','healthcare-landing-claim','healthcare-data-platform-local-dp-synthea-new-only','healthcare-data-platform-local-dp-landing-processing-v2','healthcare-data-platform-local-dp-omop-writer']
          hold=['healthcare-synthea-new-only']
          deleted=['healthcare-landing-discovery-v2','healthcare-landing-processing-v2','healthcare-data-platform-new-only-omop-writer']
          result={'active':[],'hold':[],'deleted':[]}
          def get(url):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=18) as r:return json.load(r)
          def versions(name):
              acc=[]
              for pg in range(1,10):
                  rows=get(base+quote(name,safe='')+'/versions?per_page=100&page='+str(pg))
                  assert isinstance(rows,list)
                  acc.extend(rows)
                  if len(rows)<100:break
              return acc
          for name in active+hold:
              pkg=get(base+quote(name,safe=''))
              assert pkg.get('name')==name
              v=versions(name)
              assert len(v)>=1
              tags={tag for row in v for tag in row.get('metadata',{}).get('container',{}).get('tags',[])}
              if name in active:
                  assert 'latest' in tags,(name,'CURRENT_LATEST_MISSING')
              entry={'name':name,'count':len(v),'tags':sorted(tags),'versionIDs':[x.get('id') for x in v]}
              result['active' if name in active else 'hold'].append(entry)
              print('RETAINED_PACKAGE_PRESENT',name,'VERSIONS',len(v),'LATEST',('latest' in tags))
          for name in deleted:
              try:
                  get(base+quote(name,safe=''))
              except urllib.error.HTTPError as e:
                  assert e.code==404,(name,e.code)
                  print('DELETED_PACKAGE_ABSENT_HTTP_404=PASS',name)
                  result['deleted'].append({'name':name,'http':404})
              else:raise RuntimeError('DELETED_PACKAGE_STILL_EXISTS:'+name)
          result['active_versions']=sum(x['count'] for x in result['active'])
          result['hold_versions']=sum(x['count'] for x in result['hold'])
          result['remaining_version_count']=result['active_versions']+result['hold_versions']
          dest=Path(os.environ['RUNNER_TEMP'])/'ghcr-post-retirement'
          (dest/'exact-ghcr-packages.json').write_text(json.dumps(result,indent=2)+'\n')
          print('POSTDELETE_8_ACTIVE_PRESENT=PASS')
          print('POSTDELETE_1_LEGACY_MANUAL_DEPENDENCY_RETAINED=PASS')
          print('POSTDELETE_3_PACKAGE_404=PASS')
          print('POSTDELETE_SCOPED_VERSION_COUNT',result['remaining_version_count'])
          print('NO_REGISTRY_DELETE_REQUESTS=PASS')
          PY
      - name: Preserve final live registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-postretirement-live-inventory
          path: ${{ runner.temp }}/ghcr-post-retirement/
          retention-days: 30
          if-no-files-found: warn
