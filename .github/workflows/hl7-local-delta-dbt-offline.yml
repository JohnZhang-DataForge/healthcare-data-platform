name: HL7 local Delta + governed canonical dbt regression (offline)
on:
  pull_request:
    paths:
      - "local-data-platform/spark/apps/hl7/**"
      - "azure-fabric/dbt/hl7-canonical/**"
      - "local-data-platform/spark/contracts/canonical/**"
      - ".github/quality/tests/data-platform/hl7/**"
      - ".github/quality/fixtures/hl7/**"
      - ".github/workflows/hl7-local-delta-dbt-offline.yml"
permissions:
  contents: read
concurrency:
  group: hl7-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-delta-dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: azure-fabric/dbt/hl7-canonical
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned parser, local Spark/Delta and dbt
        run: python -m pip install -r "$GITHUB_WORKSPACE/azure-fabric/dbt/hl7-canonical/requirements-local.txt"
      - name: Verify frozen source Mapper and fail-closed HL7 source contract
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/.github/quality/tests/data-platform/hl7" -p "test_*.py" -v
      - name: Real physical local Delta staging, replay, dbt and independent candidate readback
        run: |
          set -euo pipefail
          export HL7_LOCAL_WAREHOUSE_URI="file:${RUNNER_TEMP}/hl7-local-warehouse"
          export DBT_PROFILES_DIR="$PWD/profiles/local"
          export SPARK_LOCAL_IP=127.0.0.1
          python "$GITHUB_WORKSPACE/.github/quality/fixtures/hl7/generate_oie_v2_sample.py" "$RUNNER_TEMP/oie-v2-source"
          manifest="$RUNNER_TEMP/oie-v2-source/landing-manifest.json"
          sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          args=(--manifest "$manifest"
            --blob-root "$RUNNER_TEMP/oie-v2-source/staged-local-blob-keys"
            --manifest-sha256 "$sha"
            --source-sha256 "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            --request-id "johnscreek-hl7-gh-12345678901"
            --ingest-date "2026-11-07"
            --processing-run-id "synthetic-v2-001"
            --processed-at "2026-11-07 13:00:00"
            --warehouse-uri "$HL7_LOCAL_WAREHOUSE_URI")
          python "$GITHUB_WORKSPACE/local-data-platform/spark/apps/hl7/write_staging_delta.py" "${args[@]}"
          python "$GITHUB_WORKSPACE/local-data-platform/spark/apps/hl7/write_staging_delta.py" "${args[@]}"
          dbt debug
          dbt compile
          dbt run
          dbt test
          python "$GITHUB_WORKSPACE/.github/quality/tests/data-platform/hl7/check_local_candidate.py"
          # Reopen the *same* physical Candidate independently and run the
          # pinned Shared Canonical v1 DQ / PK-FK handoff, still no Silver write.
          export HL7_LOCAL_MANIFEST_PATH="$manifest"
          export PYTHONPATH="$GITHUB_WORKSPACE/shared-data-engine/src:$GITHUB_WORKSPACE/local-data-platform/spark/apps/hl7${PYTHONPATH:+:$PYTHONPATH}"
          python "$GITHUB_WORKSPACE/.github/quality/tests/data-platform/hl7/check_silver_handoff.py"
      - name: NEW 10-patient V2 A01/A03 physical Delta/dbt and single Silver Writer (offline)
        run: |
          set -Eeuo pipefail
          # A separate cwd isolates the Spark/Hive metastore from the frozen
          # one-patient regression; it does not create a persistent Processor.
          # Archive only Git-tracked dbt project files: 'cp -a' after the
          # one-patient run would copy its untracked Hive metastore_db, which
          # causes the new 10-person Delta staging to see the old source.
          mkdir -p "$RUNNER_TEMP/hl7-ten-project"
          git archive HEAD azure-fabric/dbt/hl7-canonical | tar -x -C "$RUNNER_TEMP/hl7-ten-project"
          cd "$RUNNER_TEMP/hl7-ten-project/azure-fabric/dbt/hl7-canonical"
          export HL7_LOCAL_WAREHOUSE_URI="file:$RUNNER_TEMP/hl7-ten-local-warehouse"
          export DBT_PROFILES_DIR="$PWD/profiles/local"
          export SPARK_LOCAL_IP=127.0.0.1
          export PYTHONPATH="$GITHUB_WORKSPACE/shared-data-engine/src:$GITHUB_WORKSPACE/local-data-platform/spark/apps/hl7:$GITHUB_WORKSPACE/azure-fabric/notebook-development${PYTHONPATH:+:$PYTHONPATH}"
          python "$GITHUB_WORKSPACE/.github/quality/fixtures/hl7/generate_oie_v2_sample.py" \
            "$RUNNER_TEMP/oie-v2-ten-source" --patients 10
          export HL7_LOCAL_MANIFEST_PATH="$RUNNER_TEMP/oie-v2-ten-source/landing-manifest.json"
          sha="$(sha256sum "$HL7_LOCAL_MANIFEST_PATH" | cut -d' ' -f1)"
          args=(--manifest "$HL7_LOCAL_MANIFEST_PATH"
            --blob-root "$RUNNER_TEMP/oie-v2-ten-source/staged-local-blob-keys"
            --manifest-sha256 "$sha"
            --source-sha256 "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            --request-id "johnscreek-hl7-gh-12345678901"
            --ingest-date "2026-11-07"
            --processing-run-id "synthetic-v2-001"
            --processed-at "2026-11-07 13:00:00"
            --warehouse-uri "$HL7_LOCAL_WAREHOUSE_URI")
          python "$GITHUB_WORKSPACE/local-data-platform/spark/apps/hl7/write_staging_delta.py" "${args[@]}"
          python "$GITHUB_WORKSPACE/local-data-platform/spark/apps/hl7/write_staging_delta.py" "${args[@]}"
          dbt debug
          dbt compile
          dbt run
          dbt test
          python "$GITHUB_WORKSPACE/.github/quality/tests/data-platform/hl7/check_ten_patient_silver.py"
          echo "HL7_V2_TEN_NEW_FHIR_PATIENT_SINGLE_SILVER_LOCAL_E2E=PASS"
          echo "HL7_V2_OIE_BLOB_FABRIC_REMOTE_WRITES=NO"
      # The formal Notebook workflow's source-version gate still assumes
      # Shared Engine 0.1.7, while current shared SOURCE is 0.1.10.
      # Independently test FHIR G4 compatibility with the exact native
      # Published/GA 0.1.7 Wheel instead of altering either release version.
      - name: FHIR G4 shared-writer regression with pinned native GA Wheel (offline)
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          NATIVE_WHEEL="azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/healthcare_data_engine-0.1.7-py3-none-any.whl"
          echo "0ae651aab21ce52592ac7462e365554dfc4a8cb0e65d44dd5ba9a39cb448c301  $NATIVE_WHEEL" | sha256sum --check
          python -m pip install --no-deps --force-reinstall "$NATIVE_WHEEL"
          PYTHONPATH="$GITHUB_WORKSPACE/azure-fabric/notebook-development" \
            python -m unittest discover \
              -s "$GITHUB_WORKSPACE/.github/quality/tests/azure-fabric/notebook" \
              -p "test_g4_*.py" -v
          echo "FHIR_G4_ONE_SILVER_WRITER_GA_017_OFFLINE=PASS"
