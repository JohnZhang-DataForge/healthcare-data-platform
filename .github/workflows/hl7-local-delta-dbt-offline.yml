name: HL7 local Delta + dbt Canonical Candidate (offline)
on:
  pull_request:
    paths:
      - "local-data-platform/spark/apps/hl7/**"
      - ".github/quality/tests/data-platform/hl7/**"
      - ".github/quality/fixtures/hl7/**"
      - ".github/workflows/hl7-local-delta-dbt-offline.yml"
permissions:
  contents: read
concurrency:
  group: hl7-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-delta-dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: local-data-platform/spark/apps/hl7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned parser, local Spark/Delta and dbt
        run: python -m pip install -r requirements-local.txt
      - name: Verify frozen source Mapper and fail-closed HL7 source contract
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/.github/quality/tests/data-platform/hl7" -v
      - name: Real physical local Delta staging, replay, dbt and independent candidate readback
        run: |
          set -euo pipefail
          export HL7_LOCAL_WAREHOUSE_URI="file:${RUNNER_TEMP}/hl7-local-warehouse"
          export DBT_PROFILES_DIR="$PWD/profiles/local"
          export SPARK_LOCAL_IP=127.0.0.1
          python "$GITHUB_WORKSPACE/.github/quality/fixtures/hl7/generate_oie_v2_sample.py" "$RUNNER_TEMP/oie-v2-source"
          manifest="$RUNNER_TEMP/oie-v2-source/landing-manifest.json"
          sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          args=(--manifest "$manifest"
            --blob-root "$RUNNER_TEMP/oie-v2-source/staged-local-blob-keys"
            --manifest-sha256 "$sha"
            --source-sha256 "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            --request-id "johnscreek-hl7-gh-12345678901"
            --ingest-date "2026-11-07"
            --processing-run-id "synthetic-v2-001"
            --processed-at "2026-11-07 13:00:00"
            --warehouse-uri "$HL7_LOCAL_WAREHOUSE_URI")
          python write_staging_delta.py "${args[@]}"
          python write_staging_delta.py "${args[@]}"
          dbt debug
          dbt compile
          dbt run
          dbt test
          python "$GITHUB_WORKSPACE/.github/quality/tests/data-platform/hl7/check_local_candidate.py"
