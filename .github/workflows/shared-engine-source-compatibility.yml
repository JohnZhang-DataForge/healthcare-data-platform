name: Shared Engine Source Compatibility

on:
  pull_request:
    paths:
      - 'shared-data-engine/**'
      - '.github/quality/tests/shared-data-engine/**'
      - '.github/quality/tests/test_person_identity_lookup_naming.py'
      - '.github/workflows/shared-engine-source-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build candidate wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir /tmp/shared-engine-wheels shared-data-engine
      - name: Install built candidate wheel
        run: |
          python -m pip install /tmp/shared-engine-wheels/*.whl
          python -c "import healthcare_data_engine as e; print('Installed candidate:', e.__version__)"
      - name: Check candidate source metadata matches installed wheel
        run: |
          python - <<'PY'
          import pathlib, tomllib
          import healthcare_data_engine as engine
          metadata = tomllib.loads(pathlib.Path('shared-data-engine/pyproject.toml').read_text())
          assert engine.__version__ == metadata['project']['version'], (engine.__version__, metadata['project']['version'])
          PY
      - name: Run source naming and compatibility regression
        run: |
          python -m unittest discover -s .github/quality/tests -p test_person_identity_lookup_naming.py -v
          python -m unittest discover -s .github/quality/tests/shared-data-engine/mapping -p test_candidate_identity_handoff.py -v
          python -m unittest discover -s .github/quality/tests/shared-data-engine/mapping -p test_identity_preview_and_fk.py -v
