name: TASK004 S3 to Writer Rollback Runtime
on:
  push:
    branches: [feature/task004-cdm-s3-to-writer-rollback]
    paths: [.github/workflows/task004-s3-writer-rollback-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-to-writer gate and syntax
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/task004 -p test_step04f_s3_writer_rollback.py -v
          python3 -m py_compile apps/task004/cdm_runtime_cli.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: images/task004-cdm-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/johnzhang-dataforge/healthcare-data-platform-task004-cdm-runtime:git-${{ github.sha }}
      - name: Record pinned digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "CDM_S3_ROLLBACK_IMAGE=ghcr.io/johnzhang-dataforge/healthcare-data-platform-task004-cdm-runtime@$DIGEST"
