name: Azure Fabric Existing Components and Modules — Terraform Validation

on:
  pull_request:
    paths:
      - 'azure-fabric/infra-terraform/components/**'
      - 'azure-fabric/infra-terraform/modules/**'
      - 'azure-fabric/infra-terraform/fabric-workspace/**'
      - 'azure-fabric/infra-terraform/shared-infra/**'
      - '.github/workflows/fabric-provider-init-validate.yml'
      - '.github/quality/tests/test_fabric_environment_structure.py'
      - '.github/quality/tests/test_fabric_workspace_root.py'
      - '.github/quality/tests/test_fabric_onelake_root.py'
      - '.github/quality/tests/test_fabric_cross_root_contract.py'
      - '.github/quality/tests/test_fabric_capacity_lifecycle.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-existing-root:
    name: "terraform validate / ${{ matrix.component }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [storage, workspace, onelake, notebook, data-factory, warehouse, foundation-iam]
    env:
      TF_INPUT: '0'
      TF_IN_AUTOMATION: 'true'
      TF_ROOT: azure-fabric/infra-terraform/components/${{ matrix.component }}
      TF_MODULE: azure-fabric/infra-terraform/modules/${{ matrix.component }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate original Root and reusable Module
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "#### FABRIC_LEGACY_ROOT_VALIDATION_OUTPUT_BEGIN ####"
          echo "ROOT=$TF_ROOT"
          echo "MODULE=$TF_MODULE"
          terraform -chdir="$TF_ROOT" fmt -check -diff
          terraform -chdir="$TF_MODULE" fmt -check -diff
          terraform -chdir="$TF_ROOT" init -backend=false -input=false -no-color
          terraform -chdir="$TF_ROOT" validate -no-color
          echo "REMOTE_BACKEND_USED=NO"
          echo "TERRAFORM_PLAN_APPLY=NO"
          echo "#### FABRIC_LEGACY_ROOT_VALIDATION_OUTPUT_END ####"

  validate-fabric-environment:
    name: "terraform validate / fabric-environment"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_INPUT: '0'
      TF_IN_AUTOMATION: 'true'
      ROOT: azure-fabric/infra-terraform/components/fabric-environment
      MODULE: azure-fabric/infra-terraform/modules/connection
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate composed Root and Connection Module without backend
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "#### FABRIC_COMPOSED_ROOT_VALIDATE_OUTPUT_BEGIN ####"
          terraform -chdir="$ROOT" fmt -check -diff
          terraform -chdir="$MODULE" fmt -check -diff
          terraform -chdir="$ROOT" init -backend=false -input=false -no-color
          terraform -chdir="$ROOT" validate -no-color
          python3 -m unittest discover -s .github/quality/tests -p 'test_fabric_environment_structure.py' -v
          echo "BACKEND_REMOTE_ACCESSED=NO"
          echo "FABRIC_PLAN_APPLY=NO"
          echo "#### FABRIC_COMPOSED_ROOT_VALIDATE_OUTPUT_END ####"

  validate-fabric-workspace-root:
    name: "terraform validate / healthcare-omop / workspace"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_INPUT: '0'
      TF_IN_AUTOMATION: 'true'
      ROOT: azure-fabric/infra-terraform/fabric-workspace/healthcare-omop/workspace
      MODULE: azure-fabric/infra-terraform/modules/workspace
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate workspace Root with backend disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "#### FABRIC_WORKSPACE_ROOT_VALIDATION_OUTPUT_BEGIN ####"
          terraform -chdir="$ROOT" fmt -check -diff
          terraform -chdir="$MODULE" fmt -check -diff
          terraform -chdir="$ROOT" init -backend=false -input=false -no-color
          # Offline validation must select the real non-default CLI Workspace.
          TF_WORKSPACE=healthcare-omop terraform -chdir="$ROOT" validate -no-color
          # Default Workspace must fail closed without touching any remote State.
          if TF_WORKSPACE=default terraform -chdir="$ROOT" validate -no-color > "$RUNNER_TEMP/fabric-default-validate.log" 2>&1; then
            echo "::error::Default Terraform CLI Workspace unexpectedly validated"
            exit 1
          fi
          grep -q "precondition failed" "$RUNNER_TEMP/fabric-default-validate.log"
          echo "DEFAULT_WORKSPACE_REJECTED=YES"
          python3 -m unittest discover -s .github/quality/tests -p 'test_fabric_workspace_root.py' -v
          echo "REMOTE_BACKEND_USED=NO"
          echo "FABRIC_PLAN_APPLY=NO"
          echo "#### FABRIC_WORKSPACE_ROOT_VALIDATION_OUTPUT_END ####"

  validate-fabric-onelake-root:
    name: "terraform validate / healthcare-omop / onelake"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_INPUT: '0'
      TF_IN_AUTOMATION: 'true'
      ROOT: azure-fabric/infra-terraform/fabric-workspace/healthcare-omop/onelake
      MODULE: azure-fabric/infra-terraform/modules/onelake
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate dependent OneLake Root without remote State
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "#### FABRIC_ONELAKE_ROOT_VALIDATION_OUTPUT_BEGIN ####"
          terraform -chdir="$ROOT" fmt -check -diff
          terraform -chdir="$MODULE" fmt -check -diff
          terraform -chdir="$ROOT" init -backend=false -input=false -no-color
          TF_WORKSPACE=healthcare-omop terraform -chdir="$ROOT" validate -no-color
          if TF_WORKSPACE=default terraform -chdir="$ROOT" validate -no-color > "$RUNNER_TEMP/fabric-onelake-default-validation.log" 2>&1; then
            echo "::error::Default Terraform CLI workspace unexpectedly validated"
            exit 1
          fi
          grep -q "precondition failed" "$RUNNER_TEMP/fabric-onelake-default-validation.log"
          python3 -m unittest discover -s .github/quality/tests -p 'test_fabric_onelake_root.py' -v
          echo "UPSTREAM_STATE_READ=NO"
          echo "CLOUD_RESOURCE_CREATED=NO"
          echo "#### FABRIC_ONELAKE_ROOT_VALIDATION_OUTPUT_END ####"

  validate-fabric-shared-storage:
    name: "terraform validate / shared-infra / storage"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_INPUT: '0'
      TF_IN_AUTOMATION: 'true'
      ROOT: azure-fabric/infra-terraform/shared-infra/storage
      MODULE: azure-fabric/infra-terraform/modules/storage
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate shared Storage lookup and cross Root contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "#### FABRIC_SHARED_STORAGE_STATIC_OUTPUT_BEGIN ####"
          terraform -chdir="$ROOT" fmt -check -diff
          terraform -chdir="$ROOT" init -backend=false -input=false -no-color
          terraform -chdir="$ROOT" validate -no-color
          python3 -m unittest discover -s .github/quality/tests -p 'test_fabric_cross_root_contract.py' -v
          echo "REMOTE_BACKEND_USED=NO"
          echo "CLOUD_PLAN_APPLY=NO"
          echo "#### FABRIC_SHARED_STORAGE_STATIC_OUTPUT_END ####"

  validate-capacity-lifecycle-api:
    name: "unit / Fabric Capacity lifecycle REST boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capacity REST contract and mocked HTTP tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s .github/quality/tests -p 'test_fabric_capacity_lifecycle.py' -v
          echo "CAPACITY_HTTP_CALLED=NO"
          echo "CLOUD_MUTATION=NO"
