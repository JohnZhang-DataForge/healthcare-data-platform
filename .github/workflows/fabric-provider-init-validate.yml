name: Fabric Environment — Terraform Validation

on:
  pull_request:
    paths:
      - 'azure-fabric/infra-terraform/**'
      - '.github/workflows/fabric-provider-init-validate.yml'
      - '.github/quality/tests/test_fabric_environment_structure.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fabric-environment:
    name: "terraform validate / fabric-environment"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_INPUT: '0'
      TF_IN_AUTOMATION: 'true'
      ROOT: azure-fabric/infra-terraform/components/fabric-environment
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate canonical Root and three reusable Modules (no Backend)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "#### FABRIC_SINGLE_ROOT_VALIDATE_OUTPUT_BEGIN ####"
          terraform -chdir="$ROOT" fmt -check -diff
          for module in workspace onelake connection; do
            terraform -chdir="azure-fabric/infra-terraform/modules/$module" fmt -check -diff
          done
          terraform -chdir="$ROOT" init -backend=false -input=false -no-color
          terraform -chdir="$ROOT" validate -no-color
          python3 -m unittest discover -s .github/quality/tests -p 'test_fabric_environment_structure.py' -v
          echo "REMOTE_BACKEND_ACCESSED=NO"
          echo "FABRIC_PLAN_APPLY=NO"
          echo "#### FABRIC_SINGLE_ROOT_VALIDATE_OUTPUT_END ####"
