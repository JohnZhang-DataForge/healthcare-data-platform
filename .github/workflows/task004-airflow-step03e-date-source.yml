name: TASK004 Airflow STEP03E Date Source Gate

on:
  push:
    branches:
      - 'feature/task004-airflow-step03e-run-after'
    paths:
      - 'airflow/dags/task004_processing_pipeline.py'
      - 'tests/task004/test_airflow_task004_processing_source.py'
      - 'tests/task004/test_airflow_step03e_manual_run_dates.py'
      - '.github/workflows/task004-airflow-step03e-date-source.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate manual-run date source
        run: |
          set -Eeuo pipefail

          python3 -m py_compile             airflow/dags/task004_processing_pipeline.py

          python3 -m unittest discover             -s tests/task004             -p 'test_airflow_task004_processing_source.py'             -v

          python3 -m unittest discover             -s tests/task004             -p 'test_airflow_step03e_manual_run_dates.py'             -v

          echo "TASK004_AIRFLOW_STEP03E_DATE_SOURCE_GATE=PASS"
          echo "RESULT=PASS"
