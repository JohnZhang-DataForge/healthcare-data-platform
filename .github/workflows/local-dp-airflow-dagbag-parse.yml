name: Local DP Airflow 3.2.2 DagBag Parse

on:
  pull_request:
    paths:
      - ".github/workflows/local-dp-airflow-dagbag-parse.yml"
      - "local-data-platform/airflow/dags/**"
      - "local-data-platform/tests/airflow/test_portal_openlineage_parent_macros.py"
      - "openspec/changes/relocate-local-data-platform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dagbag:
    name: Airflow 3.2.2 DagBag offline parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build temporary parse-only image with psycopg
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'FROM apache/airflow:3.2.2\nRUN pip install --no-cache-dir "psycopg[binary]==3.2.12"\n' | docker build --pull -t local-dp-airflow-dagbag:test -f - .
          
      - name: Parse DAGs using pinned Airflow image (no scheduler or task runs)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            -e AIRFLOW_HOME=/tmp/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/opt/airflow/dags \
            -v "${PWD}/local-data-platform/airflow/dags:/opt/airflow/dags:ro" \
            --entrypoint python \
            local-dp-airflow-dagbag:test \
            -c '
          import importlib.util
          from pathlib import Path
          from airflow.models.dagbag import DagBag
          providers = {
              "airflow.providers.cncf.kubernetes.operators.pod":
              importlib.util.find_spec("airflow.providers.cncf.kubernetes")
          }
          if any(v is None for v in providers.values()):
              raise SystemExit("DAGBAG_HOLD=KUBERNETES_PROVIDER_NOT_IN_PINNED_IMAGE")
          root = Path("/opt/airflow/dags")
          assert root.is_dir(), "DAG_SOURCE_MISSING"
          bag = DagBag(dag_folder=str(root), include_examples=False, safe_mode=False)
          if bag.import_errors:
              for path, error in sorted(bag.import_errors.items()):
                  print("DAG_IMPORT_ERROR", path, error)
              raise SystemExit("DAGBAG_PARSE=FAIL")
          print("DAGBAG_PARSE=PASS")
          print("DAG_IDS=" + ",".join(sorted(bag.dags)))
          print("DAG_COUNT=" + str(len(bag.dags)))
          print("DAG_TASK_EXECUTION=NOT_PERFORMED")
          '

      - name: Render true OpenLineage provider parent macros for all three KPO tasks
        shell: bash
        run: |
          set -Eeuo pipefail
          # Reuse the existing temporary Airflow image, with NO network,
          # scheduler, database, K8s, data reads or Pod creation.
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            -e AIRFLOW_HOME=/tmp/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__OPENLINEAGE__NAMESPACE=healthcare-platform-airflow \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/opt/local-data-platform/airflow/dags \
            -v "${PWD}/local-data-platform:/opt/local-data-platform:ro" \
            --entrypoint python \
            local-dp-airflow-dagbag:test \
            /opt/local-data-platform/tests/airflow/test_portal_openlineage_parent_macros.py
          echo REAL_OPENLINEAGE_MACRO_RENDER=OFFLINE_PASS
          echo NO_RUNTIME_AND_NO_GHCR_PUBLISH=YES
