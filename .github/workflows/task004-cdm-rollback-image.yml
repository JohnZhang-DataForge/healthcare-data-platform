name: TASK004 CDM rollback image
on:
  push:
    branches: [feature/task004-cdm-runtime-writer-rollback]
    paths: [.github/workflows/task004-cdm-rollback-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install 'psycopg[binary]==3.2.10'
          python3 -m unittest discover -s tests/task004 -p test_step04f_cdm_writer_runtime_rollback.py -v
          python3 -m unittest discover -s tests/task004 -p test_step04f_dynamic_pg_writer.py -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: images/task004-cdm-runtime/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/johnzhang-dataforge/healthcare-data-platform-task004-cdm-runtime:git-${{ github.sha }}
      - run: echo "IMAGE_DIGEST=${{ steps.publish.outputs.digest }}"
