name: TASK004 STEP04F Publish CDM PostgreSQL Reader Runtime
on:
  push:
    branches: [feature/task004-step04f-cdm-pg-read-runtime]
    paths: [.github/workflows/task004-cdm-pg-read-publish.yml]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only PostgreSQL contract
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/task004 -p 'test_step04f_cdm_postgres_readonly.py' -v
          python3 -m unittest discover -s tests/task004 -p 'test_step04f_cdm_runtime_packaging.py' -v
          python3 -m py_compile apps/task004/cdm_runtime_cli.py airflow/dags/task004_cdm_postgres_readonly.py
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable reader image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/task004-cdm-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/johnzhang-dataforge/healthcare-data-platform-task004-cdm-runtime:git-${{ github.sha }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CDM_PG_READER_IMAGE_BUILD=PASS"
          echo "CDM_PG_READER_IMAGE_REF=ghcr.io/johnzhang-dataforge/healthcare-data-platform-task004-cdm-runtime@$DIGEST"
          echo "DB_MUTATION=NO"
