name: Component Code Naming
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'data-platform/**'
      - 'local-data-platform/**'
      - '.github/quality/**'
      - '.github/legacy-relocations.json'
      - 'documents/systems/data-platform/**/CODE.md'
      - 'documents/systems/azure-fabric/**/CODE.md'
      - 'documents/engineering/development/CODE.md'
      - 'spark/**'
      - 'airflow/**'
      - 'sql/**'
      - 'scripts/**'
      - 'tests/**'
      - 'images/**'
      - 'kubernetes/**'
      - 'contracts/**'
      - 'azure-fabric/**'
      - 'platform-portal/**'
      - 'config/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  check-added-code-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Unit tests for code naming guard
        run: python3 -m unittest discover -s .github/quality/tests -p 'test_*.py' -v
      - name: Require CODE.md synchronization for platform components and Fabric native items
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/quality/scripts/check_component_code_map.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Reject new Task/Step-named code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/quality/scripts/check_new_code_names.py --base "$BASE_SHA" --head "$HEAD_SHA"
