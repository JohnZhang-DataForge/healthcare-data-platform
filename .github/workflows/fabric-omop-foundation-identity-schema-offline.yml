name: Fabric OMOP Identity Schema Offline

on:
  pull_request:
    paths:
      - 'azure-fabric/deployment/warehouse/omop-foundation/**'
      - '.github/quality/tests/azure-fabric/warehouse/omop-foundation/**'
      - '.github/workflows/fabric-omop-foundation-identity-schema-offline.yml'
  push:
    branches: [main]
    paths:
      - 'azure-fabric/deployment/warehouse/omop-foundation/**'
      - '.github/quality/tests/azure-fabric/warehouse/omop-foundation/**'
      - '.github/workflows/fabric-omop-foundation-identity-schema-offline.yml'

permissions:
  contents: read

jobs:
  verify-identity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source-only schema and INT identity boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          start = ".github/quality/tests/azure-fabric/warehouse/omop-foundation"
          files = sorted(Path(start).glob("test_*.py"))
          if len(files) != 4:
              raise SystemExit(f"FABRIC_FOUNDATION_TEST_FILE_COUNT_INVALID={len(files)}; expected=4")
          suite = unittest.TestLoader().discover(start_dir=start, pattern="test_*.py")
          count = suite.countTestCases()
          print(f"FABRIC_FOUNDATION_DISCOVERED={count}; required_min=31; files={len(files)}", flush=True)
          if count < 31:
              raise SystemExit("FABRIC_FOUNDATION_TEST_DISCOVERY_FAIL")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              sys.exit(1)
          print("FABRIC_FOUNDATION_OFFLINE_TESTS=PASS; CLOUD_WRITES=0")
          PY
      - name: Confirm no cloud mutations
        run: echo "IDENTITY_SCHEMA_SOURCE_ONLY=PASS DDL_APPLY=NO ROW_WRITES=NO"
