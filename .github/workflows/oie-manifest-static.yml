name: OIE Worker01 Manifest Static Gate
on:
  pull_request:
    paths:
      - "local-data-platform/kubernetes/manifests/oie/**"
      - "local-data-platform/tests/clinical_producers/test_oie_k8s_manifests.py"
      - ".github/workflows/oie-manifest-static.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oie-manifest-static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned static-only YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Test namespace, worker01 pinning, state and image/secret gates
        run: python -m unittest discover -s local-data-platform/tests/clinical_producers -p 'test_oie_k8s_manifests.py' -v
      - name: No shared cluster side effects
        run: |
          echo "DW_OIE_K8S_APPLIED=NO"
          echo "OMOP_MUTATION=NO"
          echo "AZURE_BLOB_PUBLICATION=NO"
