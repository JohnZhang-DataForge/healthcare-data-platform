name: Local DP Airflow Source Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/local-dp-airflow-source-preflight.yml"
      - "local-data-platform/airflow/dags/**"
      - "openspec/changes/relocate-local-data-platform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dag-source-preflight:
    name: DAG source static and local import preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile current DAG Python sources without import or execution
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import ast
          from pathlib import Path
          root = Path("local-data-platform/airflow/dags")
          files = sorted(root.glob("*.py"))
          assert files, "NO_DAG_SOURCES"
          names = {p.stem for p in files}
          failures = []
          dags = {}
          for path in files:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              compile(tree, str(path), "exec")
              imports = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      module = node.module.split(".")[0]
                      if not (module in names or module in {"__future__", "airflow", "datetime", "pathlib", "typing", "collections", "functools", "itertools", "json", "sys", "os", "re", "hashlib", "time", "logging", "uuid", "decimal", "copy", "dataclasses", "base64", "urllib", "subprocess", "tempfile", "math", "csv"}):
                          imports.append(module)
              if imports:
                  failures.append(f"{path}:UNRECOGNIZED_IMPORTS:{','.join(sorted(set(imports)))}")
              for node in ast.walk(tree):
                  if isinstance(node, ast.keyword) and node.arg == "dag_id" and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                      dags.setdefault(node.value.value, []).append(path.name)
          if failures:
              raise SystemExit("\n".join(failures))
          duplicates = {k:v for k,v in dags.items() if len(set(v)) > 1}
          if duplicates:
              raise SystemExit(f"DUPLICATE_STATIC_DAG_IDS={duplicates}")
          print(f"DAG_SOURCE_COUNT={len(files)}")
          print(f"STATIC_DAG_IDS={sorted(dags)}")
          print("DAG_SOURCE_SYNTAX=PASS")
          print("DAG_PARSE_RUNTIME=NOT_VERIFIED")
          PY
