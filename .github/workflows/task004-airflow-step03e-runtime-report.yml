name: TASK004 Airflow STEP03E Runtime Report Gate

on:
  push:
    branches:
      - 'feature/task004-airflow-step03e-runtime-report'
    paths:
      - 'scripts/task004/04a-prepare-synthea-landing-publisher.sh'
      - 'scripts/task004/04c-run-synthea-generate-publish.sh'
      - 'tests/task004/test_airflow_step03e_runtime_report_path.py'
      - '.github/workflows/task004-airflow-step03e-runtime-report.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate runtime report source
        run: |
          set -Eeuo pipefail

          bash -n             scripts/task004/04a-prepare-synthea-landing-publisher.sh

          bash -n             scripts/task004/04c-run-synthea-generate-publish.sh

          python3 -m unittest discover             -s tests/task004             -p 'test_airflow_step03e_runtime_report_path.py'             -v

          echo "TASK004_AIRFLOW_STEP03E_RUNTIME_REPORT_SOURCE=PASS"

      - name: Verify generator determinism
        run: |
          set -Eeuo pipefail

          TMP_ROOT="$RUNNER_TEMP/task004-step03e-report-reconstruct"

          rm -rf "$TMP_ROOT"

          PROJECT_ROOT="$TMP_ROOT"             bash               scripts/task004/04a-prepare-synthea-landing-publisher.sh

          cmp             scripts/task004/04c-run-synthea-generate-publish.sh             "$TMP_ROOT/scripts/task004/04c-run-synthea-generate-publish.sh"

          echo "TASK004_AIRFLOW_STEP03E_RUNTIME_REPORT_GENERATOR=PASS"
          echo "RESULT=PASS"
