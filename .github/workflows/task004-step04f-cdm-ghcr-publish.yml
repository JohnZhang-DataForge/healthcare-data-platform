name: TASK004 STEP04F Publish CDM Runtime Image
on:
  push:
    branches:
      - feature/task004-step04f-cdm-ghcr-publish
    paths:
      - .github/workflows/task004-step04f-cdm-ghcr-publish.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: task004-step04f-cdm-ghcr-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source baseline and run package tests
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = 897cc15c514f635eedcb3cd7edc0c9765aafb757
          for f in test_step04f_cdm_runtime_packaging.py test_step04f_dynamic_row_adapters.py test_step04f_dynamic_source.py test_step04f_dynamic_pg_writer.py; do
            python3 -m unittest discover -s tests/task004 -p "$f" -v
          done
          echo CDM_PACKAGE_TESTS=PASS
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login using repository-scoped Actions token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish digest-addressable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/task004-cdm-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/johnzhang-dataforge/healthcare-data-platform-task004-cdm-runtime:git-${{ github.sha }}
      - name: Verify immutable digest is present
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE_REF="ghcr.io/johnzhang-dataforge/healthcare-data-platform-task004-cdm-runtime@${IMAGE_DIGEST}"
          echo "CDM_GHCR_PUBLISH=PASS"
          echo "CDM_IMAGE_DIGEST=${IMAGE_DIGEST}"
          echo "CDM_IMAGE_REFERENCE=${IMAGE_REF}"
          echo "K8S_DEPLOYMENT=NO"
          echo "AIRFLOW_TRIGGER=NO"
          echo "POSTGRESQL_MUTATION=NO"
          {
            echo "### TASK004 CDM Runtime GHCR image"
            echo "Image: \`${IMAGE_REF}\`"
            echo "Source SHA: \`${GITHUB_SHA}\`"
            echo "Publish: PASS"
            echo "Kubernetes/Airflow/PostgreSQL: NOT TOUCHED"
          } >> "$GITHUB_STEP_SUMMARY"
