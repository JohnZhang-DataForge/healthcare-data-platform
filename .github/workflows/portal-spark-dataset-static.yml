name: Portal P3 Spark Dataset I-O Offline Contract

on:
  pull_request:
    paths:
      - ".github/workflows/portal-spark-dataset-static.yml"
      - "platform-portal/openlineage/spark/**"
      - "openspec/changes/complete-platform-portal-lineage-integration/**"
      - "documents/systems/platform-portal/spark/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-contract:
    name: Offline Spark Parquet input-output and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned offline-renderer dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install -r platform-portal/openlineage/spark/requirements-static.txt
      - name: P3 isolated render, fixture, PVC and negative path tests
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s platform-portal/openlineage/spark/tests -p 'test_*.py' -v
          python3 -m py_compile platform-portal/openlineage/spark/probe.py \
            platform-portal/openlineage/spark/render.py
          python3 platform-portal/openlineage/spark/render.py --run-token portal01 \
            > "${RUNNER_TEMP}/portal-p3-rendered.yaml"
          test -s "${RUNNER_TEMP}/portal-p3-rendered.yaml"
          echo PORTAL_P3_ISOLATED_SPARK_STATIC=PASS
          echo SPARK_EXECUTION=NOT_TRIGGERED
          echo KUBERNETES_PVC_CREATE=NOT_TRIGGERED
          echo MARQUEZ_JOB_RUN_DATASET_READBACK=NOT_VERIFIED
