name: Local DP Isolated Image Build Gates

on:
  pull_request:
    paths:
      - ".github/workflows/local-dp-isolated-image-build.yml"
      - "local-data-platform/images/synthea/**"
      - "local-data-platform/images/task004-runtime/**"
      - "local-data-platform/apps/task004/validate_generated_synthea_batch.py"
      - "local-data-platform/contracts/synthea/**"
      - "local-data-platform/scripts/task004/**"
      - "local-data-platform/spark/**"
      - "openspec/changes/relocate-local-data-platform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-build-smoke:
    name: ${{ matrix.component }} isolated build and smoke (no publish)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [synthea, task004-runtime]
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify platform Docker COPY sources exist
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "${{ matrix.component }}" <<'PY'
          import pathlib
          import re
          import sys
          root = pathlib.Path("local-data-platform")
          dockerfile = root / "images" / sys.argv[1] / "Dockerfile"
          text = dockerfile.read_text(encoding="utf-8")
          lines = re.sub(r"\\\n", " ", text).splitlines()
          sources = []
          for line in lines:
              line = line.strip()
              if not line.startswith("COPY ") or "--from=" in line:
                  continue
              parts = line.split()
              parts = [p for p in parts[1:] if not p.startswith("--")]
              if len(parts) < 2:
                  raise SystemExit(f"UNCERTAIN_COPY_LINE={line}")
              sources.extend(parts[:-1])
          for source in sources:
              if source.startswith(("/", "$")) or "*" in source:
                  raise SystemExit(f"UNSUPPORTED_COPY_SOURCE={source}")
              if not (root / source).is_file():
                  raise SystemExit(f"MISSING_COPY_SOURCE={source}")
          if not sources:
              raise SystemExit("NO_LOCAL_COPY_SOURCES")
          print("LOCAL_DP_COPY_SOURCE_GATE=PASS")
          print(f"LOCAL_COPY_SOURCE_COUNT={len(sources)}")
          PY

      - name: Isolated clean build without image publication
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --pull --no-cache \
            --build-arg "PROJECT_GIT_SHA=${GITHUB_SHA}" \
            --file "local-data-platform/images/${{ matrix.component }}/Dockerfile" \
            --tag "local-dp-${{ matrix.component }}:test" \
            local-data-platform
          echo "CLEAN_BUILD=PASS"

      - name: Read-only container entrypoint and image identity
        shell: bash
        run: |
          set -Eeuo pipefail
          component="${{ matrix.component }}"
          image="local-dp-${component}:test"
          if [[ "${component}" == "synthea" ]]; then
            docker run --rm --network none "${image}" --help | grep -F "Healthcare Data Platform TASK004 Synthea Generator"
            docker run --rm --network none --entrypoint /usr/bin/test "${image}" -s /opt/healthcare/apps/task004/validate_generated_synthea_batch.py
          else
            docker run --rm --network none "${image}" version | grep -F "TASK004_RUNTIME_IMAGE=YES"
            docker run --rm --network none --entrypoint /usr/bin/test "${image}" -s /data/spark/healthcare-data-platform/spark/apps/task004/reconcile_person_visit.py
          fi
          docker image inspect "${image}" --format 'IMAGE_ID={{.Id}} SOURCE_REVISION={{index .Config.Labels "org.opencontainers.image.revision"}}'
          echo "ENTRYPOINT_SMOKE=PASS"
          echo "PUBLISH=SKIPPED"
