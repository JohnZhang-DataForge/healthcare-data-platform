name: Fabric FHIR Notebook Offline Contract
on:
  pull_request:
    paths:
      - 'azure-fabric/notebook-development/**'
      - '.github/quality/tests/azure-fabric/notebook/**'
      - 'azure-fabric/workspaces/healthcare-omop/**'
      - '.github/workflows/fabric-fhir-notebook-offline.yml'
      - 'documents/systems/azure-fabric/CODE.md'
permissions:
  contents: read
jobs:
  notebook-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1704067200'
      SPARK_LOCAL_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for SHA-pinned 0.1.3 historical Wheel readback
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify effective GA 0.1.7 Wheel and 0.1.6 immutable rollback baseline
        run: |
          set -Eeuo pipefail
          python -m pip wheel -w "$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          python -m venv "$RUNNER_TEMP/fabric-offline"
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --find-links="$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          LIBS='azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries'
          CURRENT="$LIBS/healthcare_data_engine-0.1.7-py3-none-any.whl"
          CURRENT_SHA='0ae651aab21ce52592ac7462e365554dfc4a8cb0e65d44dd5ba9a39cb448c301'
          HISTORICAL="$RUNNER_TEMP/healthcare_data_engine-0.1.6-py3-none-any.whl"
          HISTORICAL_SHA='473df0171de89a1260ce8bd4b58de301802a23f28cd7c6007c8f9563772748ff'
          git show '3e1a036e309e72d8c9c79e5923333987c1c9eef7:azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/healthcare_data_engine-0.1.6-py3-none-any.whl' > "$HISTORICAL"
          echo "$HISTORICAL_SHA  $HISTORICAL" | sha256sum --check
          test "$(find "$LIBS" -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          echo "$CURRENT_SHA  $CURRENT" | sha256sum --check
          grep -qx 'version = "0.1.7"' shared-data-engine/pyproject.toml
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --no-deps --force-reinstall "$CURRENT"
          "$RUNNER_TEMP/fabric-offline/bin/python" - <<'PY'
          import healthcare_data_engine as engine
          from healthcare_data_engine.mapping.omop.candidate_publication import decide_candidate_publication
          assert engine.__version__ == "0.1.7"
          assert callable(decide_candidate_publication)
          print("G5_017_PUBLISHED_BINARY_NATIVE_BUSINESS_TESTS_READY")
          PY
          echo 'GA_017_PINNED_WHEEL_INSTALLED=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'G5_HISTORICAL_016_PRESERVED_FOR_ROLLBACK=PASS' >> "$GITHUB_STEP_SUMMARY"
          # No standalone Cloud smoke; business P3 Writer regression is tested directly.

      - name: Synthetic Manifest plus local PySpark readback tests; ZERO cloud writes
        env:
          PYTHONPATH: azure-fabric/notebook-development
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fabric-offline/bin/python" - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          start = ".github/quality/tests/azure-fabric/notebook"
          test_files = sorted(Path(start).glob("test_*.py"))
          if len(test_files) != 9:
              raise SystemExit(f"FABRIC_NOTEBOOK_TEST_FILE_COUNT_INVALID={len(test_files)}; expected=9")
          suite = unittest.TestLoader().discover(start_dir=start, pattern="test_*.py")
          found = suite.countTestCases()
          print(f"FABRIC_NOTEBOOK_DISCOVERED={found}; required_min=100; files={len(test_files)}", flush=True)
          if found < 100:
              raise SystemExit("FABRIC_NOTEBOOK_TEST_DISCOVERY_FAIL")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              sys.exit(1)
          PY
      - name: Verify Native Git source; runtime remains HOLD
        run: |
          set +e
          "$RUNNER_TEMP/fabric-offline/bin/python" azure-fabric/notebook-development/native_item_readiness.py > "$RUNNER_TEMP/native-gate.txt"
          result=$?
          set -e
          cat "$RUNNER_TEMP/native-gate.txt"
          test "$result" = 2 || { echo "EXPECTED_P2_RUNTIME_HOLD; got $result"; exit 1; }
          grep -q "HOLD_NATIVE_RUNTIME_DEPLOYMENT" "$RUNNER_TEMP/native-gate.txt"
          echo "NATIVE_GIT_EXPORT_VERIFIED_RUNTIME_HOLD"
      - name: Archive historical 0.1.6 rollback Wheel (not re-publish)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-g5-historical-016-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/healthcare_data_engine-0.1.6-py3-none-any.whl
          if-no-files-found: error
          retention-days: 30

  g5-source-017-native-version-separation:
    name: G5 actual 0.1.7 GA business P3 source API and immutable old 0.1.6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1704067200'
      SPARK_LOCAL_HOSTNAME: localhost
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned historical GA 0.1.6 from immutable repo commit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build P3 source 0.1.7 twice; verify GA and one Git-native candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -qx 'version = "0.1.7"' shared-data-engine/pyproject.toml
          grep -qx '__version__ = "0.1.7"' shared-data-engine/src/healthcare_data_engine/__init__.py
          LIBS='azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries'
          GA="$RUNNER_TEMP/healthcare_data_engine-0.1.6-py3-none-any.whl"
          GA_SHA='473df0171de89a1260ce8bd4b58de301802a23f28cd7c6007c8f9563772748ff'
          CANDIDATE_SHA='0ae651aab21ce52592ac7462e365554dfc4a8cb0e65d44dd5ba9a39cb448c301'
          git show '3e1a036e309e72d8c9c79e5923333987c1c9eef7:azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/healthcare_data_engine-0.1.6-py3-none-any.whl' > "$GA"
          echo "$GA_SHA  $GA" | sha256sum --check
          test "$(find "$LIBS" -maxdepth 1 -name '*.whl' | wc -l)" = 1
          python -m pip install 'setuptools==75.8.2' 'wheel==0.45.1' 'pyspark==4.1.1'
          mkdir -p "$RUNNER_TEMP/g5-wheel-017" "$RUNNER_TEMP/g5-wheel-017-repeat"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/g5-wheel-017" ./shared-data-engine
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/g5-wheel-017-repeat" ./shared-data-engine
          WHEEL=healthcare_data_engine-0.1.7-py3-none-any.whl
          test "$(find "$RUNNER_TEMP/g5-wheel-017" -name '*.whl' | wc -l)" = 1
          cmp "$RUNNER_TEMP/g5-wheel-017/$WHEEL" "$RUNNER_TEMP/g5-wheel-017-repeat/$WHEEL"
          echo "$CANDIDATE_SHA  $RUNNER_TEMP/g5-wheel-017/$WHEEL" | sha256sum --check
          if cmp -s "$RUNNER_TEMP/g5-wheel-017/$WHEEL" "$GA"; then
            echo 'HOLD_GA_AND_CANDIDATE_COLLISION'; exit 1
          fi
          if test -f "$LIBS/healthcare_data_engine-0.1.6-py3-none-any.whl"; then
            echo "$GA_SHA  $LIBS/healthcare_data_engine-0.1.6-py3-none-any.whl" | sha256sum --check
            cmp "$LIBS/healthcare_data_engine-0.1.6-py3-none-any.whl" "$GA"
            echo 'G5_016_GIT_NATIVE_MATCHES_GA=PASS' >> "$GITHUB_STEP_SUMMARY"
          elif test -f "$LIBS/healthcare_data_engine-0.1.7-py3-none-any.whl"; then
            echo "$CANDIDATE_SHA  $LIBS/healthcare_data_engine-0.1.7-py3-none-any.whl" | sha256sum --check
            cmp "$LIBS/healthcare_data_engine-0.1.7-py3-none-any.whl" "$RUNNER_TEMP/g5-wheel-017/$WHEEL"
            echo 'G5_017_GIT_REVIEW_ONLY_MATCHES_SOURCE=PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'HOLD_G5_UNREVIEWED_GIT_NATIVE_WHEEL'; exit 1
          fi
          GA="$GA" CANDIDATE="$RUNNER_TEMP/g5-wheel-017/$WHEEL" python - <<'PY'
          import os
          from zipfile import ZipFile
          module = 'healthcare_data_engine/mapping/omop/candidate_publication.py'
          with ZipFile(os.environ['GA']) as old, ZipFile(os.environ['CANDIDATE']) as new:
              assert module not in old.namelist(), 'immutable GA 0.1.6 is unexpectedly changed'
              assert module in new.namelist(), 'candidate 0.1.7 does not contain P3'
          print('G5_016_GA_VS_017_GIT_ONLY_CANDIDATE_INDEPENDENT=PASS')
          PY
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP/g5-wheel-017/$WHEEL"
          echo 'G5_017_REPRODUCIBLE_SOURCE_WHEEL_INSTALLED=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate real P3 business Notebook symbols under GA 0.1.7
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          PYTHONPATH= python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import runpy
          import healthcare_data_engine as engine
          from healthcare_data_engine.mapping.omop.candidates import build_omop_candidates
          from healthcare_data_engine.mapping.omop.candidate_publication import decide_candidate_publication
          from healthcare_data_engine.identity.candidate_handoff import plan_candidate_identity_handoff
          assert engine.__version__ == importlib.metadata.version("healthcare-data-engine") == "0.1.7"
          assert callable(build_omop_candidates)
          assert callable(plan_candidate_identity_handoff)
          assert callable(decide_candidate_publication)
          path = (Path(os.environ["GITHUB_WORKSPACE"]) /
                  "azure-fabric/workspaces/healthcare-omop/nb_fhir_ingest.Notebook/notebook-content.py")
          nb = runpy.run_path(str(path), run_name="_p3_business_symbols_no_spark_job")
          assert nb["engine_version"] == "0.1.7"
          assert nb["run_mode"] == "HALT"
          assert nb["write_authorized"] is False
          assert nb["retention_preflight_verified"] is False
          assert callable(nb["plan_and_write_g5_candidate_delta"])
          assert callable(nb["_g5_candidate_verify_mapper_payload"])
          assert callable(nb["execute_g5_person_visit_business"])
          assert "G5_CANDIDATE_WRITE" not in path.read_text().split('if __name__ == "__main__":')[-1]
          print("G5_017_P3_BUSINESS_WRITER_SYMBOLS_RELEASE_GUARDED_PASS")
          PY
      - name: Existing G5 strict Mapper synthetic parity under installed 0.1.7
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          PYTHONPATH= python -m unittest discover -s "$GITHUB_WORKSPACE/shared-data-engine/tests" -p 'test_omop_candidates.py' -v
          echo 'G5_017_INSTALLED_SOURCE_MAPPER_OFFLINE_TESTS=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Fabric Git Update, Environment Publish, Notebook dispatch or Gold data writes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive independently built 0.1.7 GA matching Wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-g5-017-ga-p3-business-${{ github.sha }}
          path: ${{ runner.temp }}/g5-wheel-017/healthcare_data_engine-0.1.7-py3-none-any.whl
          if-no-files-found: error
          retention-days: 14
