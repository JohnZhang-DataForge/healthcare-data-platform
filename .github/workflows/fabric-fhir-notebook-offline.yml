name: Fabric FHIR Notebook Offline Contract
on:
  pull_request:
    paths:
      - 'azure-fabric/notebook-development/**'
      - 'azure-fabric/workspaces/healthcare-omop/**'
      - '.github/workflows/fabric-fhir-notebook-offline.yml'
      - 'documents/systems/azure-fabric/CODE.md'
permissions:
  contents: read
jobs:
  notebook-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1704067200'
      SPARK_LOCAL_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pinned old 0.1.1 historical Wheel plus current 0.1.3 Native Git artifact
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify 0.1.3 native Wheel and install historical 0.1.1 for unchanged HALT Notebook
        run: |
          set -Eeuo pipefail
          python -m pip wheel -w "$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          python -m venv "$RUNNER_TEMP/fabric-offline"
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --find-links="$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          mkdir -p dist
          "$RUNNER_TEMP/fabric-offline/bin/python" -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir dist ./shared-data-engine
          NEW='healthcare_data_engine-0.1.3-py3-none-any.whl'
          NEW_SHA='6f5d95a47ab87a553686afcdc405343198ded6c99d244eb57c6ab2907a1fac59'
          STAGED="azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/$NEW"
          test "$(find "$(dirname "$STAGED")" -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          echo "$NEW_SHA  dist/$NEW" | sha256sum -c -
          echo "$NEW_SHA  $STAGED" | sha256sum -c -
          cmp "dist/$NEW" "$STAGED"
          echo 'G5_013_SOURCE_NATIVE_GIT_WHEEL_BYTE_IDENTICAL=PASS' >> "$GITHUB_STEP_SUMMARY"
          # The business Native Notebook has NOT switched from its 0.1.1
          # package expectation. Test that unchanged HALT Notebook with exactly
          # the historical 0.1.1 Wheel, not with the new Candidate.
          OLD='healthcare_data_engine-0.1.1-py3-none-any.whl'
          OLD_SHA='4a914830b4835f784ddae9f8f075279325550fd7f7a4b0aa345be26ef3f7a2a3'
          BASE='536fca011384d0fe8d3c05a5c7700934d8968456'
          git show "$BASE:azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/$OLD" > "$RUNNER_TEMP/$OLD"
          echo "$OLD_SHA  $RUNNER_TEMP/$OLD" | sha256sum -c -
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --no-deps --force-reinstall "$RUNNER_TEMP/$OLD"
          "$RUNNER_TEMP/fabric-offline/bin/python" -c 'import healthcare_data_engine as h; assert h.__version__ == "0.1.1"'
          echo 'G5_NATIVE_GIT_013_NOT_YET_FABRIC_PUBLISHED=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'EXISTING_BUSINESS_NOTEBOOK_011_HALT_REGRESSION_DEPENDENCY=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Synthetic Manifest plus actual local PySpark readback tests; ZERO cloud writes
        env:
          PYTHONPATH: azure-fabric/notebook-development
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fabric-offline/bin/python" -m unittest discover -s azure-fabric/notebook-development/tests -p 'test_*.py' -v
      - name: Verify Native Git source; runtime remains HOLD
        run: |
          set +e
          "$RUNNER_TEMP/fabric-offline/bin/python" azure-fabric/notebook-development/native_item_readiness.py > "$RUNNER_TEMP/native-gate.txt"
          result=$?
          set -e
          cat "$RUNNER_TEMP/native-gate.txt"
          test "$result" = 2 || { echo "EXPECTED_P2_RUNTIME_HOLD; got $result"; exit 1; }
          grep -q "HOLD_NATIVE_RUNTIME_DEPLOYMENT" "$RUNNER_TEMP/native-gate.txt"
          echo "NATIVE_GIT_EXPORT_VERIFIED_RUNTIME_HOLD"
      - name: Archive SHA-verified sole Shared Engine Wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-g5-shared-wheel-013-candidate-${{ github.sha }}
          path: dist/healthcare_data_engine-0.1.3-py3-none-any.whl
          if-no-files-found: error
          retention-days: 30
