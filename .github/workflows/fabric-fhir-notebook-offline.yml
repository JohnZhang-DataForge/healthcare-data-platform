name: Fabric FHIR Notebook Offline Contract
on:
  pull_request:
    paths:
      - 'azure-fabric/notebook-development/**'
      - 'azure-fabric/workspaces/healthcare-omop/**'
      - '.github/workflows/fabric-fhir-notebook-offline.yml'
      - 'documents/systems/azure-fabric/CODE.md'
permissions:
  contents: read
jobs:
  notebook-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1704067200'
      SPARK_LOCAL_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # read-only access to immutable 0.1.0 source Git object
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare new 0.1.1 Git staging Wheel, then install pinned legacy 0.1.0 for HALT Notebook tests
        run: |
          set -euo pipefail
          python -m pip wheel -w "$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          python -m venv "$RUNNER_TEMP/fabric-offline"
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --find-links="$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          mkdir -p dist
          "$RUNNER_TEMP/fabric-offline/bin/python" -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir dist ./shared-data-engine
          echo "4a914830b4835f784ddae9f8f075279325550fd7f7a4b0aa345be26ef3f7a2a3  dist/healthcare_data_engine-0.1.1-py3-none-any.whl" | sha256sum --check
          staged='azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/healthcare_data_engine-0.1.1-py3-none-any.whl'
          test -f "$staged"
          test "$(find "$(dirname "$staged")" -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          echo "4a914830b4835f784ddae9f8f075279325550fd7f7a4b0aa345be26ef3f7a2a3  $staged" | sha256sum --check
          cmp dist/healthcare_data_engine-0.1.1-py3-none-any.whl "$staged"
          echo 'FABRIC_P3_GIT_WHEEL_EXACT_MATCH=PASS' >> "$GITHUB_STEP_SUMMARY"
          # Candidate P3 Wheel must match the single native Git library byte-for-byte.
          # Current production Notebook is still pinned to 0.1.0 and HALT: test it
          # against the immutable legacy Git blob, not the unpublished 0.1.1 Wheel.
          legacy_commit='10edcc7a149fb4673548c0f71d44ca264c2a85ce'
          legacy_git_path='azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/healthcare_data_engine-0.1.0-py3-none-any.whl'
          legacy_dest="$RUNNER_TEMP/healthcare_data_engine-0.1.0-py3-none-any.whl"
          git cat-file -e "$legacy_commit:$legacy_git_path"
          git show "$legacy_commit:$legacy_git_path" > "$legacy_dest"
          echo "603f1051898ebdd2da1a8127606248dc832af4f64a453386955afcb8dcf945a7  $legacy_dest" | sha256sum --check
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --no-deps "$legacy_dest"
          echo 'FABRIC_P3_NEW_STAGING_WHEEL_MATCH=PASS; NOTEBOOK_LEGACY_010_OFFLINE=VERIFIED' >> "$GITHUB_STEP_SUMMARY"
      - name: Synthetic Manifest plus actual local PySpark readback tests; ZERO cloud writes
        env:
          PYTHONPATH: azure-fabric/notebook-development
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fabric-offline/bin/python" -m unittest discover -s azure-fabric/notebook-development/tests -p 'test_*.py' -v
      - name: Verify Native Git source; runtime remains HOLD
        run: |
          set +e
          "$RUNNER_TEMP/fabric-offline/bin/python" azure-fabric/notebook-development/native_item_readiness.py > "$RUNNER_TEMP/native-gate.txt"
          result=$?
          set -e
          cat "$RUNNER_TEMP/native-gate.txt"
          test "$result" = 2 || { echo "EXPECTED_P2_RUNTIME_HOLD; got $result"; exit 1; }
          grep -q "HOLD_NATIVE_RUNTIME_DEPLOYMENT" "$RUNNER_TEMP/native-gate.txt"
          echo "NATIVE_GIT_EXPORT_VERIFIED_RUNTIME_HOLD"
      - name: Archive SHA-verified sole Shared Engine Wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-p3-shared-wheel-${{ github.sha }}
          path: dist/healthcare_data_engine-0.1.1-py3-none-any.whl
          if-no-files-found: error
          retention-days: 30
