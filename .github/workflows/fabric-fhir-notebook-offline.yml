name: Fabric FHIR Notebook Offline Contract
on:
  pull_request:
    paths:
      - 'azure-fabric/notebook-development/**'
      - '.github/quality/tests/azure-fabric/notebook/**'
      - 'azure-fabric/workspaces/healthcare-omop/**'
      - '.github/workflows/fabric-fhir-notebook-offline.yml'
      - 'documents/systems/azure-fabric/CODE.md'
permissions:
  contents: read
jobs:
  notebook-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1704067200'
      SPARK_LOCAL_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for SHA-pinned 0.1.3 historical Wheel readback
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify published 0.1.6 Native Wheel and historical 0.1.3 rollback bytes
        run: |
          set -Eeuo pipefail
          # Effective published 0.1.6 is the current sole Git-native Wheel.
          # Historical 0.1.3 is SHA verified from Git history, never installed.
          python -m pip wheel -w "$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          python -m venv "$RUNNER_TEMP/fabric-offline"
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --find-links="$RUNNER_TEMP/wheelhouse" -r shared-data-engine/requirements-test.txt
          LIBS='azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries'
          NATIVE="$LIBS/healthcare_data_engine-0.1.6-py3-none-any.whl"
          NATIVE_SHA='473df0171de89a1260ce8bd4b58de301802a23f28cd7c6007c8f9563772748ff'
          OLD="$RUNNER_TEMP/healthcare_data_engine-0.1.3-py3-none-any.whl"
          OLD_SHA='6f5d95a47ab87a553686afcdc405343198ded6c99d244eb57c6ab2907a1fac59'
          # Obtain the previously approved native Wheel from an immutable Git
          # commit, not from the NEW Git staging (which contains only 0.1.6).
          git show 'b56b73207f7abe9d98e3fa4c3603fe045af6e15a:azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/healthcare_data_engine-0.1.3-py3-none-any.whl' > "$OLD"
          test "$(find "$LIBS" -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          echo "$NATIVE_SHA  $NATIVE" | sha256sum --check
          echo "$OLD_SHA  $OLD" | sha256sum --check
          grep -qx 'version = "0.1.6"' shared-data-engine/pyproject.toml
          "$RUNNER_TEMP/fabric-offline/bin/pip" install --no-index --no-deps --force-reinstall "$NATIVE"
          "$RUNNER_TEMP/fabric-offline/bin/python" -c 'import healthcare_data_engine as h; assert h.__version__ == "0.1.6"'
          echo 'G5_013_HISTORICAL_ROLLBACK_WHEEL_PIN_VERIFIED=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'G5_016_PUBLISHED_NATIVE_ENGINE_ALIGNED=PASS' >> "$GITHUB_STEP_SUMMARY"
          # Notebook HALT, canonical Adapter 0.1.0 and G4 historical engine-0.1.1 stay immutable.

      - name: Synthetic Manifest plus local PySpark readback tests; ZERO cloud writes
        env:
          PYTHONPATH: azure-fabric/notebook-development
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fabric-offline/bin/python" - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          start = ".github/quality/tests/azure-fabric/notebook"
          test_files = sorted(Path(start).glob("test_*.py"))
          if len(test_files) != 9:
              raise SystemExit(f"FABRIC_NOTEBOOK_TEST_FILE_COUNT_INVALID={len(test_files)}; expected=9")
          suite = unittest.TestLoader().discover(start_dir=start, pattern="test_*.py")
          found = suite.countTestCases()
          print(f"FABRIC_NOTEBOOK_DISCOVERED={found}; required_min=89; files={len(test_files)}", flush=True)
          if found < 89:
              raise SystemExit("FABRIC_NOTEBOOK_TEST_DISCOVERY_FAIL")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              sys.exit(1)
          PY
      - name: Verify Native Git source; runtime remains HOLD
        run: |
          set +e
          "$RUNNER_TEMP/fabric-offline/bin/python" azure-fabric/notebook-development/native_item_readiness.py > "$RUNNER_TEMP/native-gate.txt"
          result=$?
          set -e
          cat "$RUNNER_TEMP/native-gate.txt"
          test "$result" = 2 || { echo "EXPECTED_P2_RUNTIME_HOLD; got $result"; exit 1; }
          grep -q "HOLD_NATIVE_RUNTIME_DEPLOYMENT" "$RUNNER_TEMP/native-gate.txt"
          echo "NATIVE_GIT_EXPORT_VERIFIED_RUNTIME_HOLD"
      - name: Archive immutable historical 0.1.3 baseline Wheel (not new publish)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-g5-historical-013-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/healthcare_data_engine-0.1.3-py3-none-any.whl
          if-no-files-found: error
          retention-days: 30

  g5-source-016-native-alignment:
    name: G5 Wheel 0.1.6 Native Notebook alignment with installed Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1704067200'
      SPARK_LOCAL_HOSTNAME: localhost
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and independently install only source candidate 0.1.6
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -qx 'version = "0.1.6"' shared-data-engine/pyproject.toml
          NATIVE='azure-fabric/workspaces/healthcare-omop/env_healthcare.Environment/Libraries/CustomLibraries/healthcare_data_engine-0.1.6-py3-none-any.whl'
          test "$(find "$(dirname "$NATIVE")" -maxdepth 1 -name '*.whl' | wc -l)" = 1
          echo "473df0171de89a1260ce8bd4b58de301802a23f28cd7c6007c8f9563772748ff  $NATIVE" | sha256sum --check
          python -m pip install 'setuptools==75.8.2' 'wheel==0.45.1' 'pyspark==4.1.1'
          mkdir -p "$RUNNER_TEMP/g5-wheel-016" "$RUNNER_TEMP/g5-wheel-016-repeat"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/g5-wheel-016" ./shared-data-engine
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/g5-wheel-016-repeat" ./shared-data-engine
          WHEEL=healthcare_data_engine-0.1.6-py3-none-any.whl
          test "$(find "$RUNNER_TEMP/g5-wheel-016" -name '*.whl' | wc -l)" = 1
          cmp "$RUNNER_TEMP/g5-wheel-016/$WHEEL" "$RUNNER_TEMP/g5-wheel-016-repeat/$WHEEL"
          cmp "$RUNNER_TEMP/g5-wheel-016/$WHEEL" "$NATIVE"
          sha256sum "$RUNNER_TEMP/g5-wheel-016/$WHEEL"
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP/g5-wheel-016/$WHEEL"
          echo 'G5_016_REPRODUCIBLE_SOURCE_WHEEL_INSTALLED=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Prove 0.1.6 Native Notebook accepts installed Engine and rejects old 0.1.3
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          PYTHONPATH= python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import runpy
          import healthcare_data_engine as engine
          from healthcare_data_engine.mapping.omop.candidates import build_omop_candidates
          from healthcare_data_engine.identity.candidate_handoff import plan_candidate_identity_handoff
          assert engine.__version__ == importlib.metadata.version('healthcare-data-engine') == '0.1.6'
          assert callable(build_omop_candidates) and callable(plan_candidate_identity_handoff)
          path = (Path(os.environ['GITHUB_WORKSPACE']) /
                  'azure-fabric/workspaces/healthcare-omop/nb_fhir_ingest.Notebook/notebook-content.py')
          nb = runpy.run_path(str(path), run_name='_g5_016_offline_only_no_notebook_execution')
          assert nb['engine_version'] == '0.1.6'
          assert nb['run_mode'] == 'HALT'
          # This is deliberate: old 0.1.3 code is NOT 0.1.6-compatible yet.
          try:
              nb['prepare_batch'](
                  object(), context=object(), manifest_bytes=b'',
                  source_objects=(), patient_contract_bytes=b'',
                  encounter_contract_bytes=b'')
          except ValueError as exc:
              assert str(exc) == 'SHARED_WHEEL_EFFECTIVE_VERSION_MISMATCH', exc
          else:
              raise AssertionError('HOLD_G5_016_OLD_NOTEBOOK_UNEXPECTEDLY_EXECUTABLE')
          try:
              nb['validate_read_only_runtime_smoke'](
                  mode='RUNTIME_SMOKE', allow_write=False, retention_ok=False,
                  request='', manifest='', source='', target='')
          except RuntimeError as exc:
              assert str(exc) == 'HOLD_RUNTIME_SMOKE_WRONG_ENGINE_VERSION', exc
          else:
              raise AssertionError('HOLD_G5_016_OLD_SMOKE_UNEXPECTEDLY_EXECUTABLE')
          print('G5_013_NOTEBOOK_REJECTS_016_SOURCE_WHEEL=PASS')
          print('G5_016_SOURCE_API_IMPORT_ONLY_CANDIDATE_NOT_PUBLISHED=PASS')
          PY
      - name: Existing approved synthetic G5 candidate tests on installed 0.1.6
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          PYTHONPATH= python -m unittest discover -s "$GITHUB_WORKSPACE/shared-data-engine/tests" -p 'test_omop_candidates.py' -v
          echo 'G5_016_INSTALLED_CANDIDATE_OFFLINE_TESTS=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Fabric Environment Publish, no native Notebook update, no G4/G5 Delta and no Gold write.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive exact Git-native 0.1.6 source candidate (still NOT Fabric Published)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-g5-wheel-016-source-only-${{ github.sha }}
          path: ${{ runner.temp }}/g5-wheel-016/healthcare_data_engine-0.1.6-py3-none-any.whl
          if-no-files-found: error
          retention-days: 14
