name: Build NEW_ONLY Airflow Atomic OMOP Writer Image
on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: "Explicit authorization required to publish an immutable image"
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - ".github/workflows/build-new-only-omop-writer.yml"
      - "local-data-platform/images/new-only-omop-writer/**"
      - "local-data-platform/apps/omop_writer/**"
      - "local-data-platform/airflow/dags/new_only_omop_writer_handoff.py"
      - "local-data-platform/airflow/dags/new_only_omop_routing.py"
      - "local-data-platform/airflow/dags/task004_cdm_*.py"
      - "local-data-platform/tests/omop_writer/**"
      - "openspec/changes/relocate-local-data-platform/**"
permissions:
  contents: read

jobs:
  validate-source:
    name: NEW_ONLY Writer isolated clean build and regression (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable input
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check canonical COPY inputs and reject old root fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("local-data-platform")
          dockerfile=root/"images/new-only-omop-writer/Dockerfile"
          text=dockerfile.read_text(encoding="utf-8")
          assert "task004-cdm-runtime@sha256:94979587aeee2f2ea13e2c27ffc5a8850b97381f3f126c72201fe2b2b3086f5e" in text
          source=[]
          for line in text.splitlines():
              if not line.startswith("COPY "):continue
              parts=[p for p in line.split()[1:] if not p.startswith("--")]
              if len(parts)<2:raise ValueError("BAD_COPY_SOURCE")
              source.extend(parts[:-1])
          assert source,"EMPTY_WRITER_COPY_SET"
          for p in source:
              if p.startswith(("/", "$")) or "*" in p or ".." in Path(p).parts:
                  raise ValueError("UNSUPPORTED_SOURCE="+p)
              assert (root/p).is_file(),"MISSING_CANONICAL_SOURCE="+p
              assert not Path(p).exists(),"OLD_ROOT_FALLBACK="+p
          print("WRITER_COPY_SOURCE_COUNT="+str(len(source)))
          print("WRITER_SOURCE_ROOT=local-data-platform")
          print("WRITER_OLD_ROOT_FALLBACK=ABSENT")
          print("WRITER_SOURCE_GATE=PASS")
          PY

      - name: Local clean Docker build with no publish or registry credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          docker build --pull --no-cache \
            -f local-data-platform/images/new-only-omop-writer/Dockerfile \
            -t local-dp-new-only-omop-writer:verify \
            local-data-platform
          docker image inspect local-dp-new-only-omop-writer:verify --format 'LOCAL_IMAGE_ID={{.Id}}'
          echo "WRITER_CLEAN_BUILD=PASS"
          echo "GHCR_PUBLISH=NOT_PERFORMED"

      - name: Confirm packaged imports without running business entrypoint
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges --cap-drop ALL \
            --entrypoint python local-dp-new-only-omop-writer:verify -c '
          from pathlib import Path
          import new_only_airflow_writer, build_s3_rollback_plan, task004_cdm_dynamic_pg_writer
          for module in (new_only_airflow_writer, build_s3_rollback_plan, task004_cdm_dynamic_pg_writer):
              p=Path(module.__file__).resolve()
              assert p.parent==Path("/opt/task004"),"WRONG_IMAGE_IMPORT_ROOT"
              print("IMAGE_IMPORT="+module.__name__+" FILE="+str(p))
          '
          echo "IMAGE_IMPORT_GATE=PASS"

      - name: Writer and identity regressions with network disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          for suite in test_new_only_airflow_writer_runtime.py test_new_only_writer_identity.py; do
            docker run --rm --network none --read-only \
              --security-opt no-new-privileges --cap-drop ALL \
              -e PYTHONDONTWRITEBYTECODE=1 \
              -v "$PWD/local-data-platform:/src:ro" \
              --entrypoint python local-dp-new-only-omop-writer:verify \
              -m unittest discover -s /src/tests/omop_writer -p "$suite" -v
          done
          echo "WRITER_OFFLINE_TESTS=PASS"
          echo "DAG_SPARK_PG_S3_ACTION=NONE"

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_approved == true
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Offline fail-closed runtime regression
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -c 'import ast; from pathlib import Path; p=Path("local-data-platform/apps/omop_writer/new_only_airflow_writer.py"); ast.parse(p.read_text(), filename=str(p))'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s local-data-platform/tests/omop_writer -p 'test_*airflow_writer*.py' -v
          echo TASK004_NEW_ONLY_WRITER_IMAGE_REGRESSION=PASS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./local-data-platform
          file: ./local-data-platform/images/new-only-omop-writer/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/johnzhang-dataforge/healthcare-data-platform-new-only-omop-writer:git-${{ github.sha }}
      - name: Smoke test built image with real NEW_ONLY batch identity
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/johnzhang-dataforge/healthcare-data-platform-new-only-omop-writer:git-${{ github.sha }}"
          docker run --rm -i --entrypoint python "$IMAGE" - <<'PY'
          from build_s3_rollback_plan import build
          from task004_cdm_materialization_plan import _NEW_ONLY_BATCH
          import inspect
          from task004_cdm_dynamic_pg_writer import render as pg_render
          assert "writer_identity_version" in inspect.getsource(pg_render), "OLD_PG_RENDERER_IN_IMAGE"
          batch="synthea-new-only-gh-38588671004"
          assert _NEW_ONLY_BATCH.fullmatch(batch)
          source="source=synthea/source_version=v3.3.0/ingest_date=2026-10-14/batch_id="+batch
          p=build(
            batch_id=batch,
            manifest_sha256="22b6c386b5c165e0c9cff3d3ce5fbae2115aee87b4761fc4c11fb43a2c4720b1",
            manifest_uri="s3://health-landing/"+source+"/manifest.json",
            person_processing_uri="s3a://health-processing/"+source+"/entity=patient/run_id=task004-person-test/normalized/",
            visit_processing_uri="s3a://health-processing/"+source+"/entity=encounter/run_id=task004-encounter-test/normalized/",
            person_rows=1,
            visit_rows=244,
            source_version="v3.3.0",
            writer_identity_version="synthea-new-only-v1")
          assert p["batch_id"]==batch and p["person_rows"]==1 and p["visit_rows"]==244
          print("TASK004_THIRD_NEW_ONLY_WRITER_IMAGE_PLAN_CONTRACT=PASS")
          PY
      - name: Live-image NEW_ONLY S3 decoding and 1 Person 244 Visit transforms
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/johnzhang-dataforge/healthcare-data-platform-new-only-omop-writer:git-${{ github.sha }}"
          docker run --rm -i --entrypoint python "$IMAGE" - <<'PY'
          import hashlib
          from io import BytesIO
          from build_s3_rollback_plan import build
          from task004_cdm_dynamic_source import read
          batch="synthea-new-only-gh-38588671004"
          part="source=synthea/source_version=v3.3.0/ingest_date=2026-10-14/batch_id="+batch
          manifest=b"test-fixture-for-new-only-identity"
          ctx=build(
              batch_id=batch,
              manifest_uri="s3://health-landing/"+part+"/manifest.json",
              manifest_sha256=hashlib.sha256(manifest).hexdigest(),
              person_processing_uri="s3a://health-processing/"+part+"/entity=patient/run_id=person-smoke/work/normalized/data/",
              visit_processing_uri="s3a://health-processing/"+part+"/entity=encounter/run_id=encounter-smoke/work/normalized/data/",
              person_rows=1,
              visit_rows=244,
              source_version="v3.3.0",
              writer_identity_version="synthea-new-only-v1")
          fields={"source_system":"synthea","source_version":"v3.3.0","source_batch_id":batch,"source_ingest_date":"2026-10-14"}
          patients=[dict(fields,source_record_id="person-1",gender_code="M",race_code="white",ethnicity_code="nonhispanic",birth_date="1980-01-02")]
          encounters=[dict(fields,source_encounter_id="encounter-"+str(i),source_person_id="person-1",encounter_class="ambulatory",start_datetime="2026-10-14T12:00:00Z",end_datetime="2026-10-14T13:00:00Z") for i in range(244)]
          class Body:
              def __init__(self,b):self.b=b
              def read(self):return self.b
          class Page:
              def paginate(self,*,Bucket,Prefix):
                  assert Bucket=="health-processing"
                  yield {"Contents":[{"Key":Prefix+"part-0000.parquet"}]}
          class S3:
              def get_object(self,*,Bucket,Key):
                  if Bucket=="health-landing":
                      assert Key.endswith("/manifest.json")
                      return {"Body":Body(manifest)}
                  assert Bucket=="health-processing"
                  return {"Body":Body(b"patients" if "/entity=patient/" in Key else b"encounters")}
              def get_paginator(self,name):
                  assert name=="list_objects_v2"
                  return Page()
          def decode(data):
              if data==b"patients":return patients
              if data==b"encounters":return encounters
              raise ValueError("Unexpected decoded fixture")
          ps=read(S3(),ctx,"person",decode)
          vs=read(S3(),ctx,"visit",decode)
          assert len(ps)==1 and len(vs)==244
          assert ps[0]["source_key"]=="person-1"
          assert all(x["source_person_key"]=="person-1" for x in vs)
          assert len({x["source_key"] for x in vs})==244
          print("TASK004_NEW_ONLY_REAL_IMAGE_S3_ADAPTER_PERSON_1_VISIT_244=PASS")
          PY
      - name: Record frozen candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TASK004_NEW_ONLY_WRITER_IMAGE_DIGEST=$DIGEST"
          echo "TASK004_NEW_ONLY_WRITER_IMAGE_BUILD=PASS"
