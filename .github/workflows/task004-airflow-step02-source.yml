name: TASK004 Airflow STEP02 Source Gate

on:
  push:
    branches:
      - 'feature/task004-airflow-step02-*'
    paths:
      - 'airflow/dags/task004_processing_pipeline.py'
      - 'kubernetes/manifests/task004/airflow-task004-control-runtime-rbac.yaml'
      - 'tests/task004/test_airflow_task004_processing_source.py'
      - '.github/workflows/task004-airflow-step02-source.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate TASK004 Airflow STEP02 source
        run: |
          set -Eeuo pipefail

          python3 -m py_compile             airflow/dags/task004_processing_pipeline.py

          python3 -m unittest discover             -s tests/task004             -p 'test_airflow_task004_processing_source.py'             -v

          test -s             kubernetes/manifests/task004/airflow-task004-control-runtime-rbac.yaml

          echo "TASK004_AIRFLOW_STEP02_SOURCE_GATE=PASS"
          echo "RESULT=PASS"
