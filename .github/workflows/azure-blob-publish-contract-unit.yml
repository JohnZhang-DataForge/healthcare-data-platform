name: Healthcare Azure Blob Publish Plan Contract Unit
on:
  pull_request:
    paths:
      - "local-data-platform/apps/clinical_producers/blob_publish_contract.py"
      - "local-data-platform/contracts/clinical_producers/**"
      - "local-data-platform/tests/clinical_producers/test_blob_publish_contract.py"
      - ".github/workflows/azure-blob-publish-contract-unit.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  immutable-plan-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s local-data-platform/tests/clinical_producers -p test_blob_publish_contract.py -v
      - run: |
          echo BLOB_PUBLISH_PLAN_SOURCE_BYTES_AND_KEY_CONTRACT=PASS
          echo AZURE_BLOB_UPLOAD=NOT_IMPLEMENTED
          echo SHARED_K8S_MUTATION=NO
