name: Fabric OMOP CDM54 Schema Offline

on:
  pull_request:
    paths:
      - 'azure-fabric/deployment/warehouse/omop-cdm-5.4/**'
      - '.github/quality/tests/azure-fabric/warehouse/omop-cdm-5.4/**'
      - '.github/workflows/fabric-omop-cdm54-schema-offline.yml'
  push:
    branches: [main]
    paths:
      - 'azure-fabric/deployment/warehouse/omop-cdm-5.4/**'
      - '.github/quality/tests/azure-fabric/warehouse/omop-cdm-5.4/**'
      - '.github/workflows/fabric-omop-cdm54-schema-offline.yml'

permissions:
  contents: read

jobs:
  source-pinned-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OHDSI 5.4 exact DDL + Fabric type transform contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import unittest
          start = ".github/quality/tests/azure-fabric/warehouse/omop-cdm-5.4"
          files = sorted(Path(start).glob("test_*.py"))
          if len(files) != 1:
              raise SystemExit(f"FABRIC_CDM54_TEST_FILE_COUNT_INVALID={len(files)}; expected=1")
          suite = unittest.TestLoader().discover(start_dir=start, pattern="test_*.py")
          count = suite.countTestCases()
          print(f"FABRIC_CDM54_DISCOVERED={count}; required_min=2; files={len(files)}", flush=True)
          if count < 2:
              raise SystemExit("FABRIC_CDM54_TEST_DISCOVERY_FAIL")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              sys.exit(1)
          print("FABRIC_CDM54_OFFLINE_TESTS=PASS; CLOUD_WRITES=0")
          PY
      - name: Explicit runtime scope
        run: echo "FABRIC_WAREHOUSE_DDL_APPLY=NO; DATAPLANE_WRITE=NO; SOURCE_ONLY=PASS"
