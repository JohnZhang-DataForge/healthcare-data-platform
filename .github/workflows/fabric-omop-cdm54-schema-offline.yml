name: Fabric OMOP CDM54 Schema Offline

on:
  pull_request:
    paths:
      - 'azure-fabric/warehouse/omop-cdm-5.4/**'
      - '.github/workflows/fabric-omop-cdm54-schema-offline.yml'
  push:
    branches: [main]
    paths:
      - 'azure-fabric/warehouse/omop-cdm-5.4/**'
      - '.github/workflows/fabric-omop-cdm54-schema-offline.yml'

permissions:
  contents: read

jobs:
  source-pinned-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OHDSI 5.4 exact DDL + Fabric type transform contract
        run: python3 -m unittest discover -s azure-fabric/warehouse/omop-cdm-5.4/tests -p 'test_*.py' -v
      - name: Explicit runtime scope
        run: echo "FABRIC_WAREHOUSE_DDL_APPLY=NO; DATAPLANE_WRITE=NO; SOURCE_ONLY=PASS"
