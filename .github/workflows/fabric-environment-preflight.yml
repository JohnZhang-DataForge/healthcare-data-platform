name: Fabric Environment Preflight (Offline)

on:
  pull_request:
    paths:
      - 'azure-fabric/infra-terraform/tools/fabric_environment_preflight.py'
      - 'azure-fabric/infra-terraform/tools/fabric_bootstrap_profile.py'
      - 'azure-fabric/infra-terraform/tools/fabric_bootstrap_identity.py'
      - 'azure-fabric/infra-terraform/tools/fabric_oidc_subject_audit.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_oidc_subject_audit.py'
      - 'azure-fabric/infra-terraform/tools/fabric_bootstrap_handoff.py'
      - 'azure-fabric/infra-terraform/tools/fabric_execution_readiness.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_execution_readiness.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_bootstrap_handoff.py'
      - 'azure-fabric/infra-terraform/tools/fabric_capacity_approval.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_capacity_approval.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_bootstrap_identity_root.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_bootstrap_storage_root.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_bootstrap_capacity_root.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_bootstrap_cross_root.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_bootstrap_identity.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_bootstrap_profile.py'
      - 'azure-fabric/infra-terraform/bootstrap/**'
      - 'azure-fabric/infra-terraform/tests/test_fabric_environment_preflight.py'
      - 'azure-fabric/infra-terraform/tools/fabric_deployment_target.py'
      - 'azure-fabric/infra-terraform/tools/fabric_backend_config.py'
      - 'azure-fabric/infra-terraform/new-environments/**'
      - 'azure-fabric/infra-terraform/tools/fabric_connection_metadata.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_connection_metadata.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_root_skeleton.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_connection_root.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_ci_offline.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_backend_config.py'
      - 'azure-fabric/infra-terraform/tests/test_fabric_deployment_target.py'
      - 'azure-fabric/infra-terraform/environments/fabric-environment.example.json'
      - '.github/workflows/fabric-environment-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-environment-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Terraform fmt only parses/normalizes HCL locally. It does NOT install
      # any provider, access the AzureRM backend, or open Fabric connections.
      - name: Set up pinned Terraform CLI for offline format check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'
          terraform_wrapper: false
      - name: Verify Connection HCL formatting without init
        run: |
          terraform fmt -check -diff azure-fabric/infra-terraform/new-environments/connection
      - name: Verify Bootstrap Identity Root HCL format only
        run: |
          terraform fmt -check -diff azure-fabric/infra-terraform/bootstrap/identity
      - name: Verify Bootstrap Storage and RBAC HCL format without init
        run: |
          terraform fmt -check -diff azure-fabric/infra-terraform/bootstrap/storage
      - name: Verify Bootstrap Capacity AzAPI HCL formatting without init
        run: |
          terraform fmt -check -diff azure-fabric/infra-terraform/bootstrap/capacity
      - name: Verify new Workspace HCL format without init
        run: |
          terraform fmt -check -diff azure-fabric/infra-terraform/new-environments/workspace
      - name: Verify new Lakehouse HCL format without init
        run: |
          terraform fmt -check -diff azure-fabric/infra-terraform/new-environments/onelake
      - name: Set up Python for preflight tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Bootstrap offline profile contract
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_bootstrap_profile.py' -v
          if python3 azure-fabric/infra-terraform/tools/fabric_bootstrap_profile.py \
            --config azure-fabric/infra-terraform/bootstrap/bootstrap-profile.example.json; then
            echo "::error::Unconfigured example unexpectedly passed"
            exit 1
          fi
          echo "BOOTSTRAP_EXAMPLE_FAIL_CLOSED=PASS"
      - name: Validate Bootstrap identity/OIDC offline request contract
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_bootstrap_identity.py' -v
      - name: Detect unreviewed immutable OIDC and cross-repository phase trust
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_oidc_subject_audit.py' -v
      - name: Validate Bootstrap Capacity billing evidence HOLD policy
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_capacity_approval.py' -v
      - name: Verify Bootstrap Identity Root has no default cloud mutations
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_bootstrap_identity_root.py' -v
      - name: Verify fresh-only Storage ownership and container-level RBAC
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_bootstrap_storage_root.py' -v
      - name: Verify Capacity reuse/default deny and paid ARM scope
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_bootstrap_capacity_root.py' -v
      - name: Verify cross-root resource ownership and static-only CI
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_bootstrap_cross_root.py' -v
      - name: Validate non-secret Bootstrap-to-Fabric handoff and HOLD gates
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_bootstrap_handoff.py' -v
      - name: Enforce all phases' offline integration HOLD and untrusted evidence rejection
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_execution_readiness.py' -v
      - name: Validate preflight unit tests
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_environment_preflight.py' -v
      - name: Validate isolated backend and tenant identities
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_deployment_target.py' -v
      - name: Validate safe offline backend configuration
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_backend_config.py' -v
      - name: Verify isolated root scaffolds are non-deployable
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_root_skeleton.py' -v
      - name: Validate saved Connection metadata fail-closed rules
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_connection_metadata.py' -v
      - name: Verify AzureBlobs Connection Root is default-deny and credential-safe
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_connection_root.py' -v
      - name: Ensure CI cannot execute Terraform cloud/state commands
        run: |
          python3 -m unittest discover \
            -s azure-fabric/infra-terraform/tests \
            -p 'test_fabric_ci_offline.py' -v
      - name: Confirm example is deliberately non-deployable
        run: |
          set -euo pipefail
          if python3 azure-fabric/infra-terraform/tools/fabric_environment_preflight.py \
             --config azure-fabric/infra-terraform/environments/fabric-environment.example.json; then
            echo "::error::Example must FAIL until placeholder IDs are configured."
            exit 1
          fi
          echo "EXAMPLE_FAIL_CLOSED=PASS"
