name: Portal Exporter Offline Tests

on:
  pull_request:
    paths:
      - 'platform-portal/portal/exporter/**'
      - '.github/workflows/portal-exporter-offline.yml'
      - 'platform-portal/portal/contracts/snapshot-v1.schema.json'
  push:
    branches: [main]
    paths:
      - 'platform-portal/portal/exporter/**'
      - '.github/workflows/portal-exporter-offline.yml'

permissions:
  contents: read

jobs:
  exporter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing portal schema test dependencies
        run: python -m pip install -r platform-portal/portal/requirements-test.txt
      - name: Validate Marquez read-only exporter offline
        run: python -m unittest discover -s platform-portal/portal/exporter/tests -p 'test_*.py' -v
