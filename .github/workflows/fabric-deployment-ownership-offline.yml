name: Fabric Deployment Ownership Offline

on:
  pull_request:
    paths:
      - 'azure-fabric/deployment/**'
      - 'documents/systems/azure-fabric/deployment/CODE.md'
      - '.github/quality/scripts/check_fabric_deployment_ownership.py'
      - '.github/quality/tests/azure-fabric/deployment/**'
      - '.github/workflows/fabric-deployment-ownership-offline.yml'
  push:
    branches: [main]
    paths:
      - 'azure-fabric/deployment/**'
      - 'documents/systems/azure-fabric/deployment/CODE.md'
      - '.github/quality/scripts/check_fabric_deployment_ownership.py'
      - '.github/quality/tests/azure-fabric/deployment/**'
      - '.github/workflows/fabric-deployment-ownership-offline.yml'
permissions:
  contents: read
jobs:
  ownership-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ownership checker unit regression
        run: python3 -m unittest discover -s .github/quality/tests/azure-fabric/deployment -p 'test_*.py' -v
      - name: Path owner diff gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"; fi
          python3 .github/quality/scripts/check_fabric_deployment_ownership.py --base "$BASE_SHA" --head "$HEAD_SHA"
