name: OIE Nonpersistent Debug Manifests Static Gate
on:
  pull_request:
    paths:
      - "local-data-platform/kubernetes/manifests/oie/debug/**"
      - "local-data-platform/tests/clinical_producers/test_oie_debug_manifest.py"
      - ".github/workflows/oie-debug-manifest-static.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oie-debug-manifest-static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - run: python -m unittest discover -s local-data-platform/tests/clinical_producers -p 'test_oie_debug_manifest.py' -v
      - run: |
          echo 'OIE_DEBUG_PERSISTENCE=NONE'
          echo 'OIE_K8S_DEPLOYMENT=NOT_STARTED'
