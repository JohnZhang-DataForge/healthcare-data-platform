# Airflow apache-airflow/airflow chart 1.22.0: post-move GitSync override.
# Apply to the *existing* dw-airflow Helm release with --reuse-values; do not
# install from this partial values file alone. No credentials are stored here.
# Confirm the target cluster/release and active DagRuns before upgrading.
dags:
  gitSync:
    enabled: true
    subPath: local-data-platform/airflow/dags
    # The existing release had null here. Chart 1.22.0 expects strings when
    # applying --reuse-values, and empty values preserve main/ref defaults.
    branch: ""
    rev: ""
