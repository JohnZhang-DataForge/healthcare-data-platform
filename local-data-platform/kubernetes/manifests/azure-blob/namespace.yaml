# Dedicated Azure Blob Publisher control/runtime namespace.
# Static desired state only; apply requires scoped shared-cluster authorization
# and a read-only namespace / workloads preflight.
apiVersion: v1
kind: Namespace
metadata:
  name: dw-az-blob
  labels:
    app.kubernetes.io/name: azure-blob-publisher
    app.kubernetes.io/part-of: healthcare-clinical-producers
    app.kubernetes.io/managed-by: healthcare-data-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
