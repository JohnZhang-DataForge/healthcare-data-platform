apiVersion: v1
kind: ServiceAccount
metadata:
  name: task004-control-runtime
  namespace: dw-spark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task004-control-runtime
  namespace: dw-spark
rules:
  - apiGroups:
      - sparkoperator.k8s.io
    resources:
      - sparkapplications
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - dw-spark-s3-secret
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - spark-job
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task004-control-runtime
  namespace: dw-spark
subjects:
  - kind: ServiceAccount
    name: task004-control-runtime
    namespace: dw-spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task004-control-runtime
