apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task004-airflow-pod-launcher
  namespace: dw-spark
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task004-airflow-pod-launcher
  namespace: dw-spark
subjects:
  - kind: ServiceAccount
    name: dw-airflow-scheduler
    namespace: dw-airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task004-airflow-pod-launcher
