apiVersion: v1
kind: Service
metadata:
  name: marquez-web-lan
  namespace: dw-marquez
  labels:
    app.kubernetes.io/part-of: marquez
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: marquez
    app.kubernetes.io/name: marquez
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30999
