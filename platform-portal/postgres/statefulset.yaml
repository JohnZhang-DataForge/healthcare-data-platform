apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dw-postgre14-database
  namespace: dw-postgre14
spec:
  serviceName: dw-postgre14-service
  replicas: 1
  selector:
    matchLabels:
      app: dw-postgre14-database
  template:
    metadata:
      labels:
        app: dw-postgre14-database
    spec:
      nodeSelector:
        workload: compute
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
              name: postgre14
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgre-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgre-data
          persistentVolumeClaim:
            claimName: dw-postgre14-data
